<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Win&Co Group — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown:#3c8dbc; --dark:#222d32; --cocoa:#5e6e7e; --cream:#ecf0f5; --beige:#d3dce6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--dark);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input,textarea,select{font-family:'Plus Jakarta Sans',sans-serif;}
  button{cursor:pointer;}

  .btn{border:none;border-radius:12px;padding:13px 22px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--brown);color:#fff;}
  .btn-primary:hover{background:var(--dark);}
  .btn-ghost{background:var(--white);color:var(--dark);border:1px solid var(--beige);}
  .btn-ghost:hover{background:var(--beige);}

  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:12.5px;font-weight:800;color:var(--brown);margin-bottom:7px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--beige);border-radius:10px;background:var(--white);padding:11px 13px;font-size:13.5px;color:var(--dark);}
  .field textarea{min-height:80px;resize:vertical;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brown);outline-offset:1px;}
  .err{font-size:12px;color:#dd4b39;margin-top:6px;font-weight:700;}

  /* ===== LOGIN ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--white);border:1px solid var(--beige);border-radius:22px;padding:42px 38px;max-width:400px;width:100%;text-align:center;}
  .login-card .mark{width:64px;height:64px;border-radius:16px;background:#fff;padding:8px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;border:1px solid var(--beige);}
  .login-card .mark img{width:100%;height:100%;object-fit:contain;}
  .login-card h3{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--dark);}
  .login-card p{margin:0 0 26px;font-size:12.5px;color:var(--cocoa);font-weight:500;}
  .login-card .btn{width:100%;margin-top:6px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:42px;}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--cocoa);cursor:pointer;padding:6px;line-height:1;display:flex;align-items:center;justify-content:center;}

  /* ===== APP LAYOUT ===== */
  .app-layout{display:none;min-height:100vh;}
  .app-layout.show{display:flex;}

  .sidebar{width:230px;flex:none;background:var(--dark);color:var(--cream);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;}
  .sidebar-brand{padding:24px 22px;border-bottom:1px solid rgba(255,255,255,.12);}
  .sidebar-brand .mark{width:44px;height:44px;border-radius:12px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .sidebar-brand .mark img{width:100%;height:100%;object-fit:contain;}
  .sidebar-brand .t{font-weight:800;font-size:14.5px;line-height:1.3;}
  .sidebar-brand .s{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--beige);opacity:.8;font-weight:700;margin-top:2px;}

  .sidebar-nav{flex:1;padding:18px 14px;display:flex;flex-direction:column;gap:4px;}
  .nav-btn{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;background:none;border:none;color:var(--cream);font-size:13.5px;font-weight:700;text-align:left;opacity:.72;}
  .nav-btn .ic{font-size:16px;width:20px;text-align:center;}
  .nav-btn:hover{opacity:1;background:rgba(255,255,255,.06);}
  .nav-btn.active{opacity:1;background:var(--brown);}

  .sidebar-foot{padding:16px;border-top:1px solid rgba(255,255,255,.12);}
  .sidebar-foot .email{font-size:11px;color:var(--beige);opacity:.8;padding:0 4px 10px;word-break:break-all;}
  .sidebar-foot button{width:100%;background:none;border:1px solid rgba(255,255,255,.25);color:var(--cream);font-size:12.5px;font-weight:700;padding:10px;border-radius:10px;}
  .sidebar-foot button:hover{background:rgba(255,255,255,.08);}

  .main{margin-left:230px;flex:1;padding:36px 40px 60px;max-width:1220px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{margin:0;font-size:22px;font-weight:800;}

  .year-tag{display:inline-block;background:var(--beige);color:var(--dark);font-size:11px;font-weight:800;padding:4px 12px;border-radius:100px;margin-bottom:16px;}
  .section-title{font-size:13.5px;font-weight:800;color:var(--dark);margin-bottom:16px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr 1.35fr;gap:16px;}
  .stat-card{background:var(--white);border:1px solid var(--beige);border-radius:18px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:156px;}
  .stat-card .top-row{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .stat-card .icon-badge{width:42px;height:42px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none;font-size:19px;}
  .stat-card.accept .icon-badge{background:#d9f3e6;}
  .stat-card.reject .icon-badge{background:#fde3df;}
  .stat-card.money .icon-badge{background:#f3e6d3;}
  .stat-card .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--cocoa);font-weight:800;white-space:nowrap;}
  .stat-card .sub{font-size:11px;color:var(--cocoa);font-weight:600;opacity:.85;white-space:nowrap;}
  .stat-card .v{font-size:28px;font-weight:800;color:var(--brown);line-height:1.2;white-space:nowrap;}
  .stat-card.money .v{font-size:23px;}
  .stat-card.accept .v{color:#00a65a;}
  .stat-card.reject .v{color:#dd4b39;}

  .card{background:var(--white);border:1px solid var(--beige);border-radius:18px;}
  .tbl-wrap{padding:6px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:760px;}
  thead th{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--cocoa);padding:14px 16px;border-bottom:1px solid var(--beige);font-weight:800;white-space:nowrap;}
  tbody td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--cream);font-weight:500;text-align:center;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--cream);}
  .name-cell{font-weight:700;}
  .tbl-center th, .tbl-center td{text-align:center;white-space:nowrap;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:100px;background:var(--cream);color:var(--brown);border:1px solid var(--beige);white-space:nowrap;}

  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:100px;white-space:nowrap;}
  .badge-wait{background:var(--cream);color:var(--brown);border:1px solid var(--beige);}

  .pay-dot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;white-space:nowrap;}
  .pay-dot .d{width:9px;height:9px;border-radius:50%;flex:none;}
  .pay-dot.completed .d{background:#00a65a;}
  .pay-dot.completed{color:#00a65a;}
  .pay-dot.progress .d{background:#f39c12;}
  .pay-dot.progress{color:#d68910;}
  .pay-dot.pending .d{background:#dd4b39;}
  .pay-dot.pending{color:#dd4b39;}
  .pay-dot.none .d{background:#a9b4bf;}
  .pay-dot.none{color:var(--cocoa);}
  .ev-link{color:var(--brown);font-weight:700;text-decoration:underline;}

  .view-btn{background:var(--cream);border:1px solid var(--beige);color:var(--brown);font-weight:700;font-size:11.5px;padding:6px 13px;border-radius:100px;white-space:nowrap;}
  .view-btn:hover{background:var(--beige);}
  .review-btn{background:var(--brown);color:#fff;border:none;font-weight:700;font-size:11.5px;padding:7px 15px;border-radius:100px;white-space:nowrap;}
  .review-btn:hover{background:var(--dark);}
  .remove-btn{background:#fdecea;color:#c23321;border:1px solid #f5c2bc;font-weight:700;font-size:11.5px;padding:6px 13px;border-radius:100px;white-space:nowrap;margin-left:6px;}
  .remove-btn:hover{background:#dd4b39;color:#fff;}

  /* ===== FILTER BAR ===== */
  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:end;}
  .filter-field{display:flex;flex-direction:column;gap:6px;}
  .filter-field label{font-size:10.5px;font-weight:800;color:var(--cocoa);text-transform:uppercase;letter-spacing:.04em;}
  .filter-field select{border:1px solid var(--beige);border-radius:10px;background:var(--white);padding:9px 12px;font-size:12.5px;color:var(--dark);min-width:160px;}
  .filter-reset{background:var(--cream);border:1px solid var(--beige);color:var(--brown);font-weight:700;font-size:12px;padding:9px 16px;border-radius:10px;height:37px;}
  .filter-reset:hover{background:var(--beige);}

  /* ===== HOME VISUALS ===== */
  .donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none;}
  .donut-hole{position:absolute;inset:16px;background:var(--white);border-radius:50%;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-center .n{font-size:20px;font-weight:800;color:var(--brown);}
  .donut-center .l{font-size:9px;color:var(--cocoa);font-weight:700;text-transform:uppercase;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px;}
  .legend-row .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .legend-row b{margin-left:auto;padding-left:8px;}

  .compare-bar-row{margin-bottom:16px;}
  .compare-bar-row:last-child{margin-bottom:0;}
  .compare-bar-row .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px;}
  .compare-bar-track{height:14px;background:var(--cream);border-radius:100px;overflow:hidden;}
  .compare-bar-fill{height:100%;border-radius:100px;}
  .compare-bar-fill.investasi{background:var(--brown);}
  .compare-bar-fill.saving{background:#00a65a;}

  .rank-list{display:flex;flex-direction:column;}
  .rank-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--cream);}
  .rank-row:last-child{border-bottom:none;}
  .rank-badge{width:26px;height:26px;border-radius:50%;background:var(--cream);color:var(--brown);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;}
  .rank-badge.top1{background:#f4c453;color:#5a3a00;}
  .rank-badge.top2{background:#d7d7d7;color:#444;}
  .rank-badge.top3{background:#e0ab76;color:#5a3300;}
  .rank-info{flex:1;}
  .rank-info .n{font-size:13px;font-weight:700;}
  .rank-info .d{font-size:11px;color:var(--cocoa);font-weight:500;}
  .rank-count{font-size:14px;font-weight:800;color:var(--brown);}
  .rank-total{display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:2px solid var(--beige);font-weight:800;font-size:13px;}

  /* ===== CRITERIA ===== */
  .crit-table{width:100%;border-collapse:separate;border-spacing:0;min-width:820px;}
  .crit-table thead th{background:var(--brown);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:14px 16px;text-align:center;border-bottom:none;}
  .crit-table thead th:first-child{border-top-left-radius:14px;}
  .crit-table thead th:last-child{border-top-right-radius:14px;}
  .crit-table tbody td{padding:16px;font-size:13px;border-bottom:1px solid var(--cream);vertical-align:middle;text-align:center;background:var(--white);}
  .crit-table tbody tr:last-child td{border-bottom:none;}
  .crit-table tbody tr:nth-child(even) td{background:#f5f9fc;}
  .crit-stage-badge{width:34px;height:34px;border-radius:10px;background:var(--brown);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .crit-table td.center{text-align:center;font-weight:700;color:var(--brown);}
  .crit-table td.criteria-text{line-height:1.65;color:var(--dark);text-align:justify;text-justify:inter-word;}
  .crit-award{font-style:italic;font-weight:700;color:#a97119;font-size:11px;}

  /* ===== DEPT VIZ (Home) ===== */
  .dept-viz{display:flex;flex-direction:column;gap:20px;}
  .dept-viz-row .head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:9px;}
  .dept-viz-row .head .pct{color:var(--cocoa);font-weight:800;}

  /* ===== INVESTASI & SAVING ===== */
  .page-head.head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head .sub{font-size:12.5px;color:var(--cocoa);font-weight:500;margin-top:4px;}
  .btn-excel{background:#1f7a46;color:#fff;padding:11px 18px;font-size:13px;border-radius:12px;}
  .btn-excel:hover{background:#17603a;}
  .data-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1560px;}
  .data-table.saving{min-width:1100px;}
  .data-table.investasi{table-layout:fixed;min-width:1470px;}
  .data-table th,.data-table td{vertical-align:middle;}
  .data-table td:first-child{font-weight:700;}
  .data-table thead th{background:var(--brown);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:14px 16px;text-align:center;white-space:nowrap;font-weight:800;border-bottom:none;}
  .data-table thead th:first-child{border-top-left-radius:14px;}
  .data-table thead th:last-child{border-top-right-radius:14px;}
  .data-table tbody td{padding:13px 16px;font-size:12.5px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--cream);background:var(--white);font-weight:500;font-variant-numeric:tabular-nums;}
  .data-table tbody tr:nth-child(even) td{background:#f5f9fc;}
  .data-table tbody tr:hover td{background:var(--cream);}
  .data-table tfoot td{padding:14px 16px;text-align:center;white-space:nowrap;background:var(--dark);color:#fff;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .data-table tfoot td:first-child{border-bottom-left-radius:14px;}
  .data-table tfoot td:last-child{border-bottom-right-radius:14px;}
  .pay-pill{display:inline-block;background:var(--cream);color:var(--brown);border:1px solid var(--beige);font-weight:800;font-size:11.5px;padding:4px 11px;border-radius:100px;}
  .roi-pill{display:inline-block;background:#d9f3e6;color:#00a65a;font-weight:800;font-size:11.5px;padding:4px 11px;border-radius:100px;}
  .roi-pill.neg{background:#fde3df;color:#dd4b39;}

  /* ===== NOTIFIKASI ===== */
  .notif-wrap{position:relative;}
  .notif-btn{position:relative;width:44px;height:44px;border-radius:12px;background:var(--white);border:1px solid var(--beige);color:var(--brown);display:flex;align-items:center;justify-content:center;}
  .notif-btn:hover{background:var(--beige);}
  .notif-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:100px;background:#dd4b39;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--cream);}
  .notif-panel{position:absolute;right:0;top:54px;width:360px;max-width:calc(100vw - 100px);background:var(--white);border:1px solid var(--beige);border-radius:16px;box-shadow:0 18px 40px -16px rgba(34,45,50,.4);z-index:30;overflow:hidden;}
  .notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--cream);font-size:13px;font-weight:800;}
  .notif-head button{background:none;border:none;color:var(--brown);font-size:11.5px;font-weight:700;text-decoration:underline;}
  .notif-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--cream);padding:12px 16px;}
  .notif-item:hover{background:var(--cream);}
  .notif-dot{width:9px;height:9px;border-radius:50%;background:#dd4b39;flex:none;}
  .notif-dot.read{background:var(--beige);}
  .notif-item .n{font-size:12.5px;font-weight:700;color:var(--dark);}
  .notif-item .d{font-size:11px;color:var(--cocoa);font-weight:500;margin-top:2px;}
  .notif-foot{padding:10px 16px;text-align:center;}
  .notif-foot button{background:none;border:none;color:var(--brown);font-size:12px;font-weight:800;}
  .notif-empty{padding:26px 16px;text-align:center;font-size:12.5px;color:var(--cocoa);font-weight:600;}

  /* ===== GRAFIK DATA MASUK ===== */
  .bar-chart{display:flex;align-items:flex-end;gap:14px;padding:6px 4px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-val{font-size:12px;font-weight:800;color:var(--brown);}
  .bar-fill{width:100%;max-width:56px;background:var(--brown);border-radius:8px 8px 0 0;min-height:4px;}
  .bar-lbl{font-size:11.5px;font-weight:700;color:var(--cocoa);padding-top:8px;border-top:1px solid var(--beige);width:100%;text-align:center;}
  .chart-foot{margin-top:14px;font-size:12px;font-weight:700;color:var(--cocoa);text-align:center;}

  .bar-col{min-width:0;}
  .bar-pct{font-size:9.5px;font-weight:700;color:#5e6e7e;text-align:center;}
  .bar-chart.compact{gap:10px;padding:2px 0 0;}
  .bar-chart.compact .bar-fill{max-width:34px;}
  .bar-chart.compact .bar-val{font-size:11.5px;text-align:center;}
  .bar-chart.compact .bar-lbl{font-size:9.5px;line-height:1.25;min-height:2.7em;word-break:break-word;}
  /* Top 5 Orang: bar sejajar di satu garis dasar, nama rapi tanpa terpotong */
  .bar-chart.people{gap:12px;}
  .bar-chart.people .bar-col{align-self:flex-end;}
  .bar-chart.people .bar-fill{max-width:40px;}
  .bar-chart.people .bar-lbl{font-size:10.5px;line-height:1.3;height:4em;min-height:4em;box-sizing:border-box;word-break:normal;overflow-wrap:normal;hyphens:none;padding:8px 2px 0;display:flex;align-items:flex-start;justify-content:center;}

  /* ===== TOAST ===== */
  .toast{position:fixed;right:24px;bottom:24px;background:var(--dark);color:var(--cream);font-size:13px;font-weight:700;padding:14px 20px;border-radius:12px;box-shadow:0 14px 30px -12px rgba(34,45,50,.5);z-index:80;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;}
  .toast.show{opacity:1;transform:none;}

  /* ===== EMPTY STATE ===== */
  .empty-state{text-align:center;padding:70px 20px;color:var(--cocoa);}
  .empty-state .ic{font-size:40px;display:block;margin-bottom:14px;}
  .empty-state p{font-weight:700;font-size:13.5px;margin:0;}

  /* ===== MODAL ===== */
  .overlay{position:fixed;inset:0;background:rgba(34,45,50,.82);backdrop-filter:blur(10px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{background:var(--cream);border-radius:22px;max-width:660px;width:100%;border:1px solid var(--beige);position:relative;}
  .modal.wide{max-width:960px;}
  .modal-head{padding:22px 26px;border-bottom:1px solid var(--beige);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:17.5px;font-weight:800;}
  .close-x{width:32px;height:32px;border-radius:50%;border:none;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dark);}
  .modal-body{padding:26px;}
  .modal-foot{padding:18px 26px 24px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}

  .kv-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .kv-table td{padding:8px 0;font-size:13px;border-bottom:1px solid var(--beige);vertical-align:top;}
  .kv-table td:first-child{color:var(--cocoa);font-weight:700;width:150px;}
  .kv-table td:last-child{font-weight:600;}
  .text-block{background:var(--white);border:1px solid var(--beige);border-radius:12px;padding:14px;font-size:13px;line-height:1.6;margin-bottom:14px;}
  .text-block .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--cocoa);font-weight:800;margin-bottom:6px;}
  .stage-pill{display:inline-block;background:var(--brown);color:#fff;font-size:11px;font-weight:800;padding:5px 13px;border-radius:100px;margin-bottom:14px;}

  .view-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .view-tab{background:var(--white);border:1px solid var(--beige);color:var(--cocoa);font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:100px;}
  .view-tab.active{background:var(--brown);color:#fff;border-color:var(--brown);}

  .upload-field{border:1.5px dashed var(--beige);border-radius:12px;padding:16px;text-align:center;background:var(--cream);}
  .upload-field input[type=file]{font-size:12px;width:100%;}
  .upload-filename{font-size:12px;font-weight:700;color:var(--brown);margin-top:8px;}

  /* ===== SCORING RUBRIC ===== */
  .legend-table{width:100%;border-collapse:collapse;margin-bottom:4px;}
  .legend-table td{border:1px solid var(--beige);padding:8px 10px;font-size:11.5px;text-align:center;font-weight:700;}
  .legend-table tr:first-child td{background:var(--brown);color:#fff;}
  .legend-table tr:last-child td{background:var(--white);color:var(--dark);}

  .rubric-table{width:100%;border-collapse:collapse;min-width:720px;}
  .rubric-table th{background:#dfe9f3;color:var(--dark);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 7px;border:1px solid var(--beige);text-align:center;}
  .rubric-table td{border:1px solid var(--beige);padding:6px 7px;font-size:11.5px;vertical-align:middle;text-align:center;background:var(--white);}
  .rubric-table td.desk-cell{text-align:center;font-weight:500;color:var(--cocoa);max-width:220px;line-height:1.4;}
  .rubric-table td.kriteria-cell{text-align:center;font-weight:700;color:var(--dark);}
  .rubric-table input.skor-input{width:40px;padding:5px 3px;text-align:center;border:1px solid var(--beige);border-radius:6px;font-size:12px;}
  .rubric-table td.total-skor-cell{font-weight:800;color:var(--brown);background:#f5f9fc;}

  .total-score-strip{display:flex;justify-content:space-between;align-items:center;background:#dff2e3;border:1px solid #bfe6c8;color:#215c36;font-weight:800;font-size:15px;padding:13px 18px;border-radius:12px;margin-top:18px;}

  /* ===== ANALYSIS HEATMAP ===== */
  .heat-table{width:100%;border-collapse:collapse;min-width:680px;}
  .heat-table th{text-align:center;font-size:10px;text-transform:uppercase;color:var(--cocoa);padding:10px 8px;border-bottom:1px solid var(--beige);font-weight:800;}
  .heat-table td{text-align:center;padding:11px 8px;font-size:12.5px;border-bottom:1px solid var(--cream);}

  /* ===== DEPT MINI BADGES (Home) ===== */
  .dept-mini-badges{display:flex;gap:6px;margin-top:4px;}
  .dept-mini-badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:100px;}
  .dept-mini-badge.win{background:#eadfd2;color:var(--brown);}
  .dept-mini-badge.dgi{background:#f6e3cc;color:#a5652b;}

  /* ===== DOC PAGE (reused from portal karyawan) ===== */
  .demo-note{font-size:11.5px;color:var(--cocoa);background:var(--cream);border:1px dashed var(--beige);border-radius:10px;padding:10px 14px;text-align:center;font-weight:500;}
  .doc-page{background:#fff;border:1px solid #ccc;border-radius:2px;overflow:hidden;box-shadow:0 10px 30px -14px rgba(34,45,50,.3);font-size:11.5px;color:#1a1a1a;}
  .doc-headline{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 20px 10px;border-bottom:2px solid #1a1a1a;}
  .doc-headline .ti .f{font-size:18px;font-weight:800;margin:0;}
  .doc-headline .ti .p1{font-weight:800;font-size:11.5px;margin-top:4px;max-width:360px;}
  .doc-meta{border:1px solid #999;font-size:10px;min-width:170px;}
  .doc-meta div{display:flex;justify-content:space-between;padding:3px 8px;border-bottom:1px solid #ccc;gap:10px;}
  .doc-meta div:last-child{border-bottom:none;}
  .doc-meta div span:first-child{color:#555;}
  .doc-meta div span:last-child{font-weight:700;}
  .doc-body{padding:0 0 18px;}
  .doc-sec-h{background:#595959;color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.03em;padding:6px 20px;margin-top:14px;text-transform:uppercase;}
  .doc-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .doc-table td{border:1px solid #bbb;padding:6px 10px;font-size:11px;vertical-align:top;}
  .doc-table td.lbl{background:#f0f0f0;font-weight:700;width:22%;}
  .doc-table td{word-break:break-word;overflow-wrap:anywhere;}
  .doc-table td.val{background:#dbeafc;font-weight:600;}
  .doc-checks{display:flex;flex-wrap:wrap;gap:10px 16px;background:#dbeafc;padding:8px 10px;}
  .doc-checks label{font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .doc-checks .box{width:12px;height:12px;border:1.4px solid #333;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex:none;}
  .doc-checks .box.on{background:#333;color:#fff;}
  .doc-textbox{background:#dbeafc;border:1px solid #bbb;margin:0 20px;padding:12px;min-height:56px;font-size:11px;line-height:1.6;}

  @media (max-width:1100px){
    div[style*="grid-template-columns:1fr 1fr 1fr"]{grid-template-columns:1fr !important;}
  }
  @media (max-width:960px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .sidebar{width:76px;}
    .sidebar-brand .t,.sidebar-brand .s,.nav-btn span:last-child,.sidebar-foot .email,.sidebar-foot button span{display:none;}
    .main{margin-left:76px;padding:24px 18px 60px;}
    .nav-btn{justify-content:center;}
  }

  /* ===== COLORFUL THEME OVERRIDE (warna saja, referensi AdminLTE) ===== */
  body{background:#ecf0f5;}
  .login-wrap{background:linear-gradient(135deg,#3c8dbc 0%,#605ca8 55%,#d81b60 120%);}
  .login-card{border:none;border-top:5px solid #f39c12;box-shadow:0 24px 50px -20px rgba(34,45,50,.55);}
  .login-card h3{color:#367fa9;}
  .btn-primary{background:linear-gradient(90deg,#3c8dbc,#00c0ef);}
  .btn-primary:hover{background:linear-gradient(90deg,#367fa9,#00a7d0);}
  .btn-ghost:hover{background:#d9ecf7;}
  .field label{color:#367fa9;}
  .field input:focus,.field textarea:focus,.field select:focus{outline-color:#00c0ef;}

  /* sidebar */
  .sidebar{background:#222d32;color:#d6e0e6;}
  .sidebar-brand{background:#367fa9;border-bottom:1px solid rgba(255,255,255,.15);}
  .sidebar-brand .s{color:#cfe9f7;opacity:1;}
  .nav-btn{color:#d6e0e6;opacity:.85;border-radius:8px;border-left:3px solid transparent;}
  .nav-btn:hover{opacity:1;background:#1e282c;}
  .nav-btn.active{opacity:1;background:linear-gradient(90deg,#3c8dbc,#2c6f98);color:#fff;border-left-color:#f39c12;}
  .sidebar-nav .nav-btn:nth-child(1):not(.active){border-left-color:#00c0ef;}
  .sidebar-nav .nav-btn:nth-child(2):not(.active){border-left-color:#f39c12;}
  .sidebar-nav .nav-btn:nth-child(3):not(.active){border-left-color:#00a65a;}
  .sidebar-nav .nav-btn:nth-child(4):not(.active){border-left-color:#605ca8;}
  .sidebar-nav .nav-btn:nth-child(5):not(.active){border-left-color:#dd4b39;}
  .sidebar-nav .nav-btn:nth-child(6):not(.active){border-left-color:#d81b60;}
  .sidebar-nav .nav-btn:nth-child(7):not(.active){border-left-color:#39cccc;}
  .sidebar-nav .nav-btn:nth-child(8):not(.active){border-left-color:#f39c12;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);}
  .sidebar-foot .email{color:#9fb3c0;}
  .sidebar-foot button{border-color:rgba(255,255,255,.25);color:#fff;}
  .sidebar-foot button:hover{background:#dd4b39;border-color:#dd4b39;}

  /* header & title */
  .page-head h1{color:#367fa9;}
  .year-tag{background:#605ca8;color:#fff;}

  /* cards */
  .card{border:none;border-top:3px solid #3c8dbc;box-shadow:0 1px 3px rgba(0,0,0,.15);border-radius:6px;}
  div[style*="grid-template-columns:1fr 1fr"] > .card:nth-child(1){border-top-color:#00a65a;}
  div[style*="grid-template-columns:1fr 1fr"] > .card:nth-child(2){border-top-color:#f39c12;}
  .section-title{color:#367fa9;}

  /* stat cards (kotak warna-warni) */
  .stat-card{border:none;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.2);color:#fff;}
  .stat-card .l,.stat-card .sub,.stat-card .v{color:#fff !important;}
  .stat-card .sub{opacity:.92;}
  .stat-card .icon-badge{background:rgba(255,255,255,.28) !important;}
  .stat-grid > .stat-card:nth-child(1){background:linear-gradient(135deg,#00c0ef,#0097bc);}
  .stat-grid > .stat-card:nth-child(2){background:linear-gradient(135deg,#00a65a,#008d4c);}
  .stat-grid > .stat-card:nth-child(3){background:linear-gradient(135deg,#dd4b39,#c23321);}
  .stat-grid > .stat-card:nth-child(4){background:linear-gradient(135deg,#f39c12,#db8b0b);}
  .stat-grid > .stat-card:nth-child(5){background:linear-gradient(135deg,#605ca8,#4b4789);}

  /* tables */
  thead th{color:#367fa9;}
  tbody tr:hover{background:#e8f4fb;}
  .tag{background:#d9ecf7;color:#2c6f98;border-color:#b6dbef;}
  .badge-wait{background:#fff3d6;color:#b07a00;border:1px solid #f6d98a;}
  .view-btn{background:#d9ecf7;color:#2c6f98;border-color:#b6dbef;}
  .view-btn:hover{background:#3c8dbc;color:#fff;}
  .review-btn{background:linear-gradient(90deg,#00a65a,#00c06b);}
  .review-btn:hover{background:#008d4c;}
  .ev-link{color:#3c8dbc;}
  .filter-reset{background:#fff3d6;border-color:#f6d98a;color:#b07a00;}
  .filter-reset:hover{background:#f39c12;color:#fff;}
  .crit-table thead th,.data-table thead th{background:linear-gradient(90deg,#3c8dbc,#00c0ef);}
  .data-table.investasi thead th{background:linear-gradient(90deg,#f39c12,#f9b84a);}
  .data-table.saving thead th{background:linear-gradient(90deg,#00a65a,#2ecc88);}
  .data-table tfoot td{background:#222d32;}
  .data-table.investasi tfoot td{background:#c9790a;}
  .data-table.saving tfoot td{background:#008d4c;}
  .crit-stage-badge{background:linear-gradient(135deg,#605ca8,#8a86d0);}
  .crit-table td.center{color:#605ca8;}
  .pay-pill{background:#ece9fa;color:#605ca8;border-color:#d3cdf2;}
  .stage-pill{background:#605ca8;}
  .view-tab.active{background:#3c8dbc;border-color:#3c8dbc;}
  .legend-table tr:first-child td{background:#605ca8;}
  .rubric-table td.total-skor-cell{color:#00a65a;}

  /* home charts */
  .donut-center .n{color:#367fa9;}
  .compare-bar-track{background:#e3ebf2;}
  .compare-bar-fill.investasi{background:linear-gradient(90deg,#f39c12,#f9c74f);}
  .compare-bar-fill.saving{background:linear-gradient(90deg,#00a65a,#2ecc88);}
  .dept-viz-row:nth-child(6n+1) .compare-bar-fill{background:linear-gradient(90deg,#3c8dbc,#00c0ef);}
  .dept-viz-row:nth-child(6n+2) .compare-bar-fill{background:linear-gradient(90deg,#00a65a,#2ecc88);}
  .dept-viz-row:nth-child(6n+3) .compare-bar-fill{background:linear-gradient(90deg,#f39c12,#f9c74f);}
  .dept-viz-row:nth-child(6n+4) .compare-bar-fill{background:linear-gradient(90deg,#dd4b39,#ff7b6b);}
  .dept-viz-row:nth-child(6n+5) .compare-bar-fill{background:linear-gradient(90deg,#605ca8,#8a86d0);}
  .dept-viz-row:nth-child(6n+6) .compare-bar-fill{background:linear-gradient(90deg,#d81b60,#f06292);}
  .bar-val{color:#367fa9;}
  .bar-fill{background:linear-gradient(180deg,#00c0ef,#3c8dbc);}
  .rank-badge{background:#d9ecf7;color:#2c6f98;}
  .rank-count{color:#605ca8;}
  .rank-total{border-top-color:#3c8dbc;}
  .dept-mini-badge.win{background:#d9ecf7;color:#2c6f98;}
  .dept-mini-badge.dgi{background:#fff3d6;color:#b07a00;}

  /* notifikasi, toast, modal */
  .notif-btn{color:#3c8dbc;}
  .notif-btn:hover{background:#d9ecf7;}
  .notif-badge{background:#dd4b39;}
  .notif-dot{background:#dd4b39;}
  .notif-head{background:#3c8dbc;color:#fff;}
  .notif-head button{color:#fff;}
  .toast{background:#222d32;border-left:5px solid #00c0ef;color:#fff;}
  .overlay{background:rgba(34,45,50,.82);}
  .modal{background:#ecf0f5;}
  .modal-head{background:linear-gradient(90deg,#3c8dbc,#605ca8);color:#fff;border-radius:22px 22px 0 0;border-bottom:none;}
  .modal-head h3{color:#fff;}
  .close-x{background:rgba(255,255,255,.9);}
  .close-x:hover{background:#dd4b39;color:#fff;}
  .upload-field{border-color:#3c8dbc;background:#eef6fb;}
  .upload-filename{color:#00a65a;}
  .empty-state{color:#5e6e7e;}
</style>
</head>

<script>
/* ======================= AUTH ======================= */
const authState={ loggedIn:false, email:'' };

function handleLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginErr');
  const validEmail = email.includes('@') && email.includes('.');
  if(!validEmail || !pass){
    errEl.style.display='block';
    return;
  }
  authState.loggedIn=true;
  authState.email=email;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appLayout').classList.add('show');
  document.getElementById('sidebarEmail').textContent=email;
  goPage('home');
}
function togglePwVisibility(){
  const inp=document.getElementById('loginPassword');
  const eyeIcon=document.getElementById('pwIconEye');
  const eyeOffIcon=document.getElementById('pwIconEyeOff');
  if(inp.type==='password'){ inp.type='text'; eyeIcon.style.display='none'; eyeOffIcon.style.display='block'; }
  else{ inp.type='password'; eyeIcon.style.display='block'; eyeOffIcon.style.display='none'; }
}
function handleLogout(){
  authState.loggedIn=false;
  authState.email='';
  document.getElementById('loginEmail').value='';
  document.getElementById('loginPassword').value='';
  document.getElementById('loginErr').style.display='none';
  document.getElementById('appLayout').classList.remove('show');
  document.getElementById('loginScreen').style.display='flex';
}

/* ======================= NOTIFIKASI ======================= */
const notifRead=new Set();
let notifOpen=false;
function notifItems(){ return [...waitingList].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)); }
function notifUnread(){ return waitingList.filter(w=>!notifRead.has(w.id)).length; }
function toggleNotif(e){ if(e) e.stopPropagation(); notifOpen=!notifOpen; renderPage(); }
function notifMarkAll(e){ if(e) e.stopPropagation(); waitingList.forEach(w=>notifRead.add(w.id)); renderPage(); }
function notifOpenItem(id){ notifRead.add(id); notifOpen=false; renderPage(); viewWaitingDetail(id); }
function notifGoWaiting(){ notifOpen=false; goPage('waiting'); }
document.addEventListener('click',e=>{
  if(notifOpen && !e.target.closest('.notif-wrap')){ notifOpen=false; if(currentPage==='home') renderPage(); }
});
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),4000);
}
/* Dipanggil saat ada data SS baru masuk dari portal karyawan: otomatis masuk Waiting List (Screening 1) + notif */
function receiveSubmission(data){
  const item=Object.assign({
    id:genId(2000+waitingList.length), nama:'', businessUnit:'WIN', dept:deptOptions[0], jabatan:roleOptions[0],
    jenis:null, tanggal:new Date().toISOString().slice(0,10), bulan:new Date().getMonth()+1, tglMulai:null, deadline:null, beforeEvidence:[], afterEvidence:[], problem:'', solution:'', situationAfter:'', evalResults:''
  }, data, {status:'Screening 1'});
  waitingList.unshift(item);
  showToast('Data baru masuk: '+item.nama+' ('+item.id+')');
  if(currentPage==='home'||currentPage==='waiting') renderPage();
}

function genId(n){ return 'WIN-CI-2026-'+String(n).padStart(6,'0'); }
function na(v){ return (v===null||v===undefined||String(v).trim()==='')?'Tidak ada':v; }
function evidenceHTML(list){
  if(!list||!list.length) return 'Tidak ada';
  return list.map((v,i)=>/^https?:/i.test(v)?`<a class="ev-link" href="${v}" target="_blank" rel="noopener">Bukti ${i+1} ↗</a>`:`📎 ${v}`).join(' &nbsp;·&nbsp; ');
}
function payClassOf(st){ return st==='COMPLETED'?'completed':(st==='IN PROGRESS'?'progress':(st==='NONE'?'none':'pending')); }
function payLabelOf(st){ return st==='COMPLETED'?'Completed':(st==='IN PROGRESS'?'In Progress':(st==='NONE'?'Tidak ada':'Pending')); }
function fmtDate(str){
  if(!str) return 'Tidak ada';
  const d=new Date(str);
  if(isNaN(d)) return str;
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
}
function fmtRupiah(n){
  return 'Rp' + n.toLocaleString('id-ID');
}

gu. Kondisi tersebut menyebabkan distribusi titik sampling antar minggu tidak merata karena jadwal monitoring rutin Zona 1 dan Zona 2 sering bertepatan dengan jadwal monitoring periodik Zona 3, Zona 4, maupun Air Test. Akibatnya terdapat minggu dengan jumlah titik sampling yang jauh lebih tinggi dibanding minggu lainnya sehingga beban kerja EMP menjadi tidak seimbang.<br><br>Selain itu, setiap terdapat penambahan titik sampling akibat mesin atau area baru maupun pergantian kalender tahunan, jadwal harus disusun kembali secara manual. Proses tersebut memerlukan waktu, berpotensi menimbulkan kesalahan distribusi jadwal, serta belum mampu memastikan pemerataan beban kerja antar minggu.","solution":"Mengembangkan aplikasi berbasis web EMP Scheduler sebagai sistem digital untuk mengelola jadwal Environmental Monitoring Program secara otomatis.<br><br>Aplikasi ini dirancang untuk menghasilkan distribusi jadwal sampling yang lebih seimbang dengan mempertahankan seluruh persyaratan frekuensi monitoring sesuai program EMP.<br><br>Fitur utama sistem meliputi:<br><br>- Digitalisasi master data titik Swab dan Air Test.<br>- Generate jadwal EMP otomatis berdasarkan kalender setiap tahun.<br>- Distribusi otomatis titik sampling fleksibel (Zona 3, Zona 4, dan Air Test sesuai rule) ke minggu dengan beban kerja lebih rendah.<br>- Mempertahankan jadwal tetap (fixed schedule) untuk Zona 1 dan Zona 2 sesuai frekuensi monitoring yang dipersyaratkan.<br>- Penyesuaian otomatis apabila terdapat penambahan titik sampling baru.<br>- Monitoring pelaksanaan sampling, dashboard analitik, serta pembuatan laporan mingguan dan bulanan secara otomatis.","situationAfter":"Setelah EMP Scheduler diimplementasikan, penyusunan jadwal EMP tidak lagi dilakukan secara manual menggunakan Microsoft Excel. Sistem secara otomatis menghasilkan jadwal berdasarkan kalender tahun berjalan serta mendistribusikan titik sampling yang fleksibel ke minggu dengan beban kerja yang lebih rendah sehingga distribusi workloa const scoringList = [{"id":"001/WIN/SS/26","nama":"Hanitovani Danisworo","businessUnit":"WIN","dept":"Quality Management","jabatan":"Leader","jenis":null,"tanggal":"2026-04-13","bulan":4,"tglMulai":null,"deadline":null,"problem":"Saat ini, proses perhitungan hasil pengujian kualitas produk di laboratorium (baik Proksimat maupun Mikrobiologi) masih dilakukan secara manual setelah pengujian selesai. Mengingat tingginya jumlah sampel harian yang harus diuji, proses perhitungan manual ini memakan waktu yang cukup lama dan berpotensi menimbulkan human error (salah hitung/salah input rumus). Hal ini menyebabkan wasting time (pemborosan waktu) bagi analis laboratorium dan memperlambat waktu rilis data hasil pengujian (lead time). Kondisi ini tidak efisien dan menghambat produktivitas kerja harian.","solution":"Menciptakan aplikasi berbasis web &#x27;LabWIN Calc Pro&#x27; untuk otomatisasi kalkulasi hasil uji lab. Ide utamanya adalah mengubah proses hitung manual menjadi sistem &#x27;Input-Click-Result&#x27;. Analis hanya perlu memasukkan angka hasil pengujian ke dalam kolom yang tersedia. Aplikasi akan langsung memproses perhitungan sesuai rumus ilmiah dan secara otomatis membandingkannya dengan standar spesifikasi mutu (misalnya Cocoa Powder Max 5.0%). Hasil akhirnya akan langsung muncul dilengkapi dengan keterangan warna PASS/FAIL, sehingga mempercepat proses evaluasi sampel.","situationAfter":"Dengan diimplementasikannya aplikasi LabWIN Calc Pro, proses perhitungan hasil uji laboratorium menjadi jauh lebih cepat dan efisien. Waktu yang dibutuhkan analis untuk menghitung hasil dari data mentah berkurang hingga &gt;80% karena tidak lagi menggunakan kalkulator manual. Seluruh standar mutu sudah tertanam di dalam sistem, sehingga status PASS/FAIL muncul secara instan tepat setelah tombol hitung ditekan. Hal ini memungkinkan analis untuk segera fokus pada persiapan sampel berikutnya tanpa tertunda oleh antrean perhitungan.","evalResults":"Setelah dilakukan uji coba penggunaa sa di lepas pasang dan di hapus.","situationAfter":"Penggunaan label magnetik lebih efisien.","evalResults":"1. Efisiensi penggunaan label menjadi tidak boros, biasanya jika menggunakan label fox hanya 1 kali pakai.<br>2. Label magnetik bisa di pakai berulang.<br>3. Label magnetik tidak membekas ketika di lepas","beforeEvidence":["https://drive.google.com/open?id=1L7F3pZe-56C-VSAFq8a4d85JslC1F2V2"],"afterEvidence":["https://drive.google.com/open?id=1HLU8-4s5JPjjXqcso2-xLccRjzI8_KiF"],"docStatus":"COMPLETED","stage":"Screening 1","nilai":7.5,"totalScore":7.5,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"019/WIN/SS/26","nama":"Hanitovani Danisworo","businessUnit":"WIN","dept":"Quality Management","jabatan":"Leader","jenis":null,"tanggal":"2026-05-27","bulan":5,"tglMulai":"2026-04-22","deadline":"2026-05-08","problem":"Pada proses pengajuan dan monitoring analisa sampel menggunakan sistem sebelumnya (WinApps), masih ditemukan beberapa kendala operasional yang mempengaruhi efektivitas komunikasi dan alur kerja antara requester (R&amp;D) dan QM laboratorium. Sistem WinApps belum menyediakan transparansi informasi terkait kapan sampel bisa mulai dianalisa oleh laboratorium maupun estimasi kapan hasil analisa dapat selesai dan diterima oleh requester. Kondisi tersebut menyebabkan requester mengalami kesulitan dalam memonitor progres pengerjaan sampel serta sering melakukan follow up manual kepada tim laboratorium terkait status analisa.<br><br>Selain itu, distribusi hasil analisa masih dilakukan secara manual melalui komunikasi personal seperti WhatsApp setelah analis laboratorium menyelesaikan proses analisa. Kondisi tersebut menyebabkan proses distribusi hasil menjadi kurang terstandarisasi dan berpotensi menimbulkan keterlambatan maupun missed information.<br><br>Ditemukan pula beberapa kasus dimana requester telah menyerahkan sampel fisik ke laboratorium namun belum melakukan submit ROA pada sistem hingga beberapa hari setelah analisa selesai dilakukan. Hal ini menyebabkan tim analis laboratorium mengalami kendala saat akan melakukan input hasil analisa karena data pengajuan belum tersedia pada sistem, sehingga analis harus membuat pengajuan ROA secara mandiri atas nama requester terkait.<br><br>Selain itu, terdapat juga kasus dimana requester telah melakukan submit ROA pada sistem, namun sampel fisik belum diberikan ke laboratorium hingga lebih dari ±1 bulan setelah pengajuan dilakukan. Kondisi tersebut menyebabkan terjadinya miskomunikasi antara requester dan laboratorium terkait status pengerjaan sampel. Penundaan penyerahan sampel fisik juga berpotensi mempengaruhi kualitas dan kondisi sampel sebelum dilakukan proses analisa, sehingga dapat meningkatkan risiko penurunan mutu maupun ketidaksesuaian hasil analisa.<br><br>Berdasarkan kondisi tersebut, diperlukan pengembangan sistem digitalisasi proses pengajuan dan monitoring analisa sampel yang lebih terintegrasi, transparan, dan terdokumentasi guna meningkatkan efektivitas proses kerja laboratorium dan requester melalui implementasi sistem LabFlow.","solution":"Sebagai upaya improvement dan digitalisasi proses pengajuan analisa sampel laboratorium, diajukan pengembangan sistem internal berbasis web application bernama &quot;LabFlow&quot; untuk menggantikan dan menyempurnakan proses pada sistem sebelumnya (WinApps).<br><br>LabFlow dirancang sebagai sistem pengajuan dan monitoring analisa sampel yang lebih terintegrasi, transparan, dan terdokumentasi antara requester dan laboratorium. Sistem ini digunakan secara internal melalui local hosting laboratorium sehingga proses submit ROA dilakukan langsung di area laboratorium bersamaan dengan penyerahan sampel fisik kepada tim analis.<br><br>Beberapa improvement utama yang diimplementasikan pada sistem LabFlow antara lain:<br><br>- Penambahan fitur &quot;Analysis Date&quot; dan &quot;Due Date&quot; sehingga requester dapat mengetahui estimasi waktu pengerjaan dan target penyelesaian hasil analisa sampel secara transparan.<br>- Sistem monitoring status analisa secara real-time melalui dashboard LabFlow.<br>- Integrasi otomatis pengiriman hasil analisa dimana setelah analis melakukan approval hasil analisa, sistem secara otomatis generate dokumen ROA dalam format PDF sesuai template resmi laboratorium dan langsung mengirimkannya ke email requester.<br>- Sinkronisasi proses submit ROA dengan penyerahan sampel fisik guna mengurangi miskomunikasi antara requester dan laboratorium.<br>- Digitalisasi proses distribusi hasil analisa sehingga tidak lagi bergantung pada komunikasi manual melalui WhatsApp.<br>- Peningkatan dokumentasi dan tracking histori proses analisa melalui audit trail sistem.<br><br>Selain itu, sistem LabFlow juga dikembangkan untuk membantu laboratorium dalam mengatur estimasi pengerjaan analisa berdasarkan antrian parameter tertentu, seperti pengujian fineness, sehingga estimasi due date menjadi lebih realistis sesuai kapasitas pengerjaan analis laboratorium.<br><br>Dengan implementasi sistem LabFlow, diharapkan proses pengajuan, monitoring, dan distribusi hasil analisa sampel menjadi lebih efektif, transparan, terdokumentasi, serta mampu meningkatkan koordinasi antara requester dan laboratorium dibandingkan sistem sebelumnya.","situationAfter":"Setelah implementasi sistem LabFlow, proses pengajuan dan monitoring analisa sampel laboratorium menjadi lebih terintegrasi, transparan, dan terdokumentasi dibandingkan sistem sebelumnya (WinApps).<br><br>Requester kini dapat mengetahui informasi status pengerjaan sampel secara lebih jelas melalui dashboard LabFlow, termasuk informasi Analysis Date sebagai waktu mulai analisa dan Due Date sebagai estimasi penyelesaian hasil analisa. Fitur ini membantu meningkatkan transparansi proses analisa serta mengurangi kebutuhan follow up manual kepada tim laboratorium terkait status pengerjaan sampel.<br><br>Proses submit ROA juga menjadi lebih sinkron dengan penyerahan sampel fisik karena pengajuan dilakukan langsung melalui perangkat laboratorium (local hosting) pada saat requester menyerahkan sampel ke laboratorium. Improvement ini membantu mengurangi kasus keterlambatan submit ROA maupun kasus submit ROA tanpa penyerahan sampel fisik yang sebelumnya sering menyebabkan miskomunikasi antara requester dan laboratorium.<br><br>Selain itu, distribusi hasil analisa kini telah terdigitalisasi secara otomatis melalui sistem LabFlow. Setelah analis laboratorium melakukan approval hasil analisa, sistem secara otomatis generate dokumen ROA dalam format PDF sesuai template resmi laboratorium dan langsung mengirimkannya ke email requester. Dengan adanya sistem ini, proses distribusi hasil analisa menjadi lebih cepat, terdokumentasi, dan tidak lagi bergantung pada komunikasi manual melalui WhatsApp.<br><br>Implementasi LabFlow juga membantu meningkatkan efektivitas administrasi laboratorium melalui sistem monitoring, tracking histori proses analisa, serta estimasi pengerjaan yang lebih realistis berdasarkan antrian parameter pengujian tertentu.<br><br>Berdasarkan hasil evaluasi pengguna internal selama ±1 bulan penggunaan dengan total 6 requester user, sistem LabFlow dinilai memberikan peningkatan efektivitas proses pengajuan dan monitoring analisa sampel dibandingkan sistem sebelumnya.","evalResults":"Evaluasi implementasi sistem LabFlow dilakukan melalui kuesioner pengguna internal setelah sistem digunakan selama ±1 bulan operasional dengan total 6 requester user sebagai responden evaluasi.<br><br>Berdasarkan hasil evaluasi, mayoritas pengguna menilai bahwa sistem LabFlow memberikan peningkatan efektivitas dibandingkan sistem sebelumnya (WinApps), khususnya dalam proses monitoring status analisa sampel, transparansi estimasi pengerjaan, serta distribusi hasil analisa secara digital.<br><br>Fitur Analysis Date dan Due Date dinilai membantu requester dalam mengetahui estimasi waktu pengerjaan dan penyelesaian hasil analisa secara lebih jelas dan terstruktur. Selain itu, fitur otomatisasi pengiriman hasil analisa dalam format PDF ke email requester setelah approval analis laboratorium dinilai mempermudah proses distribusi hasil dan mengurangi ketergantungan pada komunikasi manual.<br><br>Hasil evaluasi juga menunjukkan bahwa implementasi LabFlow membantu mengurangi potensi miskomunikasi terkait submit ROA, penyerahan sampel fisik, dan monitoring status pengerjaan sampel yang sebelumnya sering terjadi pada sistem WinApps.<br><br>Secara keseluruhan, pengguna memberikan respon positif terhadap implementasi sistem LabFlow dan menilai bahwa sistem ini lebih efektif, transparan, serta mendukung peningkatan efisiensi proses administrasi dan komunikasi antara requester dan laboratorium.","beforeEvidence":["https://drive.google.com/open?id=1R1ZIFjr6_cdJYfNry8dJ674BClVwUcyT"],"afterEvidence":["https://drive.google.com/open?id=1tLDAhpzoAvVBZNmIpvDmjeK4H3tUPNpt"],"docStatus":"COMPLETED","stage":"Screening 2","nilai":12.75,"totalScore":12.75,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"020/WIN/SS/26","nama":"Aidah","businessUnit":"WIN","dept":"Quality Management","jabatan":"Leader","jenis":null,"tanggal":"2026-05-28","bulan":5,"tglMulai":"2026-05-25","deadline":"2026-05-26","problem":"Produk hold yang lama tersimpan belum di follow up","solution":"Sekarang sudah dibuat secara digital yang dimana produk hold akan ada notif melalui email","situationAfter":"produk yang hold lebih cepat ditindak lanjut","evalResults":"Dengan adanya notif ini<br>* Efisiensi waktu pada saat pengecekan produk hold, karena sebelum ada notifikasi harus mencari produk hold secara manual<br>* pengecekan produk hold menjadi terjadwal<br>* mempercepat tindak lanjut produk hold<br>* mengurangi produk hold","beforeEvidence":["https://drive.google.com/open?id=1iD2auHSDsUDXfH9E-g3t7U7OPXML16s5"],"afterEvidence":["https://drive.google.com/open?id=1X933zg_OR-XS8NKVPGLQQuJRm8-Z7h81"],"docStatus":"COMPLETED","stage":"Screening 2","nilai":10.5,"totalScore":10.5,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"021/DGI/SS/26","nama":"Sidik Aji","businessUnit":"DGI","dept":"Production","jabatan":"Leader","jenis":null,"tanggal":"2026-06-04","bulan":6,"tglMulai":"2026-05-18","deadline":"2026-06-05","problem":"sebelumnya area WIP belum memiliki daily report monitoring yang terstruktur untuk memantau transaksi masuk, keluar, return,hold, saldo akhir serta umur ( aging ) setiap batch/material. kondisi ini menyebabkan PPIC dan tim terkait kesulitan menelusuri stok WIP yang harus segera digunakan, memantau batch yang sudah lama tersimpan, serta melakukan kontrol data sebagai acuan input dan pengecekan ke SAP.","solution":"membuat daily report harian WIP/SFG yang di-update setiap hari sebagai alat monitoring transaksi stok dan acuan kontrol input SAP. Report menampilkan saldo awal, total masuk, total keluar, total return, total hold, closing stock, available stock, batch number, production date, serta aging material yang bertambah setiap hari. report juga dilengkapi visual management dengan kode warna untuk memudahkan pemantauan umur simpan:<br>- kurang dari 30 hari = hijau <br>- 30 sampai 60 hari = kuning <br>lebih dari 60 hari = merah","situationAfter":"setelah daily report diterapkan, stok WIP/SFG menjadi lebih mudah ditelusur dan dimonitor setiap hari. PPIC dan tim terkait dapat lebih cepat mengetahui batch yang masih baru, yang perlu segera diprioritaskan untuk digunakan, serta stok yang berstatus hold atau masih tersedia. daily report ini juga membantu kontrol data harian sebelum dan saat dilakukan pengecekan ke SAP","evalResults":"setelah daily report berjalan, PPIC dan tim terkait lebih mudah mengetahui stok WIP/SFG dengan umur simpan terbaru maupun terlama. monitoring aging menjadi lebih jelas, penelusuran transaksi stok menjadi lebih cepat,  dan prioritas penggunaan material dapat ditentukan dengan lebih baik. selain itu, report ini membantu meningkatkan kontrol administrasi stok harian dan mendukung pengecekan data terhadap SAP secara lebih tertib.","beforeEvidence":["https://drive.google.com/open?id=1_swSuiPzuAkR04MAioV8QbrP9uACWMux"],"afterEvidence":["https://drive.google.com/open?id=1vYvGoD5dvTwUbDYtpDEA8RjeLlxCSMWu"],"docStatus":"COMPLETED","stage":"Screening 1","nilai":9.0,"totalScore":9.0,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"022/DGI/SS/26","nama":"Ema Sulastri","businessUnit":"DGI","dept":"HSE Sanitation","jabatan":"Operator","jenis":null,"tanggal":"2026-06-05","bulan":6,"tglMulai":"2026-05-05","deadline":"2026-06-29","problem":"Kondisi penyimpanan bahan kimia (chemical) di ruang sanitasi saat ini belum tertata dengan baik dan kurang terorganisir. Penempatan bahan kimia yang tidak rapi menyebabkan proses pencarian dan pengambilan bahan menjadi kurang efektif serta berpotensi menimbulkan kesalahan dalam penggunaan. Selain itu, sebagian bahan kimia belum dilengkapi dengan identitas atau label yang jelas, sehingga menyulitkan proses identifikasi dan pengendalian bahan.Di samping itu, belum tersedia  kartu stok sebagai sarana pencatatan keluar-masuk dan penggunaan bahan kimia. Akibatnya, pemantauan persediaan bahan menjadi kurang optimal","solution":"Melakukan penataan ulang area penyimpanan bahan kimia (chemical) di ruang sanitasi dengan memberikan identitas atau label yang jelas pada setiap bahan sesuai jenis dan fungsinya. Selain itu, dilakukan pengelompokan serta penempatan bahan secara teratur agar area penyimpanan lebih rapi, mudah diakses, dan mempermudah proses pencarian maupun pengambilan bahan.Untuk meningkatkan pengendalian persediaan, dibuat kartu stok sebagai sarana pencatatan keluar-masuk dan penggunaan bahan kimia.","situationAfter":"Penyimpanan bahan kimia di ruang sanitasi menjadi lebih rapi dan terorganisir. Setiap bahan telah diberi label yang jelas dan ditempatkan pada lokasi yang ditentukan, sehingga proses identifikasi dan pengambilan bahan lebih mudah. Selain itu, penggunaan kartu stok membantu pemantauan persediaan bahan kimia menjadi lebih akurat dan terkendali.","evalResults":"1. Penyimpanan bahan kimia menjadi lebih rapi, tertata, dan mudah diakses saat diperlukan.<br>2. Identifikasi bahan kimia menjadi lebih jelas sehingga meminimalkan risiko kesalahan penggunaan.<br>3. Stok bahan kimia lebih terkontrol melalui kartu stok, sehingga persediaan dapat dipantau dengan akurat.","beforeEvidence":["https://drive.google.com/open?id=1ReTyfAogM5YWXEAFAmp-HKx_VNRzRy89"],"afterEvidence":["https://drive.google.com/open?id=1SEPLmW5fKqGtey8v0mZg3nvib056NVmp","https://drive.google.com/open?id=1W55yrsf-DmLwUJ248xj_cnjE-bpx0l5T"],"docStatus":"COMPLETED","stage":"Screening 1","nilai":8.75,"totalScore":8.75,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"023/DGI/SS/26","nama":"Evyta Avia Phury","businessUnit":"DGI","dept":"Quality Management","jabatan":"Leader","jenis":null,"tanggal":"2026-06-08","bulan":6,"tglMulai":"2026-06-06","deadline":"2026-06-08","problem":"Terjadi kesalahan pencantuman tanggal kedaluwarsa pada produk (jar dan sticker karton). Kesalahan ini disebabkan oleh kegagalan mengidentifikasi siklus tahun kabisat. Ketidaksesuaian penanggalan berdampak pada penolakan sistem transaksi material di SAP serta adanya rework (pencetakan dan penempelan ulang label pada produk)","solution":"Merancang dan mengimplementasikan sistem &quot;ED Calculator&quot; berbasis Excel otomatis untuk membantu operator menghitung tanggal kedaluwarsa secara instan dan akurat. Sistem ini mengintegrasikan data masa berlaku (shelf life) berdasarkan masing-masing kategori produk secara langsung, sehingga meminimalkan proses hitung manual yang rawan kesalahan.","situationAfter":"Telah tersedia lembar kerja ED Calculator yang terstandardisasi. Operator kini hanya perlu memasukkan data nama produk, nomor batch, dan tanggal produksi. Sistem secara otomatis menarik data masa berlaku (bulan), menghitung tanggal kedaluwarsa secara presisi","evalResults":"Penerapan ED Calculator membantu Proses penentuan tanggal kedaluwarsa menjadi jauh lebih cepat dan terstandardisasi. . Standarisasi ini sukses mengeliminasi risiko salah hitung, meningkatkan akurasi data inventaris, dan memastikan kontrol kualitas yang lebih ketat.","beforeEvidence":["https://drive.google.com/open?id=15ajBoYypFovVhlCqVvBt720-r5EapvRo"],"afterEvidence":["https://drive.google.com/open?id=14OZLsyJmSwiPSqipjYE9k14-rcwnIEjh"],"docStatus":"COMPLETED","stage":"Screening 1","nilai":8.75,"totalScore":8.75,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"024/DGI/SS/26","nama":"Evyta Avia Phury","businessUnit":"DGI","dept":"Quality Management","jabatan":"Leader","jenis":null,"tanggal":"2026-06-08","bulan":6,"tglMulai":"2026-06-04","deadline":"2026-06-05","problem":"Saat ini proses verifikasi label produk sebelum digunakan pada proses produksi belum memiliki form pemeriksaan yang baku dan terdokumentasi. Pemeriksaan masih dilakukan secara visual tanpa checklist yang jelas sehingga berpotensi menyebabkan informasi pada label tidak sesuai dengan spesifikasi produk, seperti nama produk, batch number, tanggal kedaluwarsa, logo halal, nomor BPOM, dan informasi penting lainnya.<br><br>Selain itu, belum tersedia bukti terdokumentasi yang menunjukkan bahwa QC telah melakukan verifikasi label sebelum digunakan dalam proses produksi.<br><br>Pada tanggal 4 Juni 2026 terjadi kesalahan pada hasi cetak nomor MD pada label semicoat untuk identitas cartoning produk cruffle raspberry garuda indonesia, dimana nomor MD yang tercetak pada label semicoat tidak sesuai dengan nomor MD yang ada pada kemasan sachet cruffle raspberry garuda indonesia","solution":"Membuat dan menerapkan Form Verifikasi Label Produk yang digunakan sebelum proses packing carton pada produk dilakukan. Form berisi parameter pe br><br>Tindak lanjut: apabila jumlah pail yang dimanfaatkan sebagai pot sudah melebihi kebutuhan, pail akan dievaluasi untuk dijual sebagai barang bekas atau dimanfaatkan menjadi produk kreatif lain yang bernilai guna.","situationAfter":"Setelah dilakukan perbaikan, pail bekas yang sebelumnya tidak terpakai berhasil dimanfaatkan menjadi pot bunga sehingga mengurangi limbah dan menghemat biaya pembelian pot. Area sanitasi menjadi lebih bersih, rapi, dan asri, serta menciptakan lingkungan kerja yang lebih nyaman dan terawat. Selain itu, pemanfaatan kembali pail bekas meningkatkan kepedulian terhadap lingkungan dan membuka peluang pemanfaatan lanjutan melalui penjualan atau pengembangan produk kreatif lainnya apabila kebutuhan pot telah terpenuhi.","evalResults":"Mengurangi jumlah pail bekas yang tidak terpakai di area kerja.<br>Menghemat biaya pembelian pot bunga.<br>Meningkatkan kebersihan dan kerapian ruang sanitasi.<br>Mempercantik area sanitasi sehingga lebih nyaman dipandang.<br>Memanfaatkan barang bekas yang masih layak pakai sehingga mengurangi limbah.<br>Meningkatkan kepedulian terhadap lingkungan melalui kegiatan reuse (penggunaan kembali).<br>Menciptakan lingkungan kerja yang lebih bersih, asri, dan terawat.<br>Mendorong pemanfaatan berkelanjutan pail bekas melalui opsi penjualan atau pengembangan produk kreatif lain ketika kebutuhan pot telah terpenuhi.","beforeEvidence":["https://drive.google.com/open?id=1Ey2OcsE6qpm2bODvQOcxqT-VSx37m6LI"],"afterEvidence":["https://drive.google.com/open?id=1RmovryXniLTxDfWxmR7opTrrGZsdTg_o","https://drive.google.com/open?id=1vfZm8y8ACvOSbe9mEgOwYxoQ0ozSd-MB","https://drive.google.com/open?id=1_NhtPZYnOKslVdd4D3X4tOFvHc78S_9v"],"docStatus":"COMPLETED","stage":"Screening 1","nilai":8.25,"totalScore":8.25,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"026/DGI/SS/26","nama":"Saepul Kholiq","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-06-11","bulan":6,"tglMulai":"2026-06-09","deadline":"2026-06-12","problem":"Sebelumnya material kurasan 3 produksi yang akan diserahterimakan ke HSE pada periode tertentu belum memiliki area penempatan khusus. Kondisi ini menyebabkan material kurasan 3 kadang tercampur dengan material lain sehingga area penyimpanannya menjadi kurang terorganisir. Akibat nya, proses indentifikasi dan pencairan material kurasan 3 menjadi lebih sulit, serta berpotensi menimbulkan ketidaktertiban area penyimpanan sementara.","solution":"Membuat area khusus untuk penempatan kurasan 3 produksi sebelum diserahterimakan ke HSE. Area ini dipisahkan dari material lain dan di lengkapi dengan tagging/penandaan area agar fungsi lokasi nya jelas, sehingga material kurasan 3 dapat di tempatkan secara khusus, lebih rapi, dan lebih mudah dikontrol sebelum proses serah terima ke HSE","situationAfter":"Setelah dilakukan perbaikan, kurasan 3 di tempatkan pada area khusus yang telah ditentukan dan dipisahkan dari material lain. Dengan adanya area khusus dan tagging yang jelas, material kurasan 3 menjadi lebih di kenali, lebih tertata, dan tidak lagi bercampur dengan material lain. Area penyimpanan sementara juga menjadi lebih rapi dan memudahkan proses monitoring sebelum serah terima ke HSE.","evalResults":"Setelah dibuat area khusus 3, penempatan  material menjadi lebih terorganisir dan tidak lagi bercampur dengan material lain. Proses indentifikasi, pencarian, dan monitoring material kurasan 3 menjadi lebih mudah, sehingga persiapan serah terima ke HSE dapat dilakukan dengan lebih tertib. Improvement ini membantu meningkatkan kerapihan area, memperjelas fungsi lokasi penyimpan, serta mendukung visual management di area produksi","beforeEvidence":["https://drive.google.com/open?id=1qDWdaGHQHShx3GsNBzZ7gs2MhqkweKk3"],"afterEvidence":["https://drive.google.com/open?id=1PtYFhfb6xqtPVl3xCgIC4GIBKrwQvn1v"],"docStatus":"COMPLETED","stage":"Screening 1","nilai":8.25,"totalScore":8.25,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"027/DGI/SS/26","nama":"Deni Hartani","businessUnit":"DGI","dept":"HSE Sanitation","jabatan":"Leader","jenis":null,"tanggal":"2026-06-18","bulan":6,"tglMulai":"2026-05-01","deadline":"2026-05-20","problem":"Saat ini, koordinasi pekerjaan berisiko tinggi (seperti pekerjaan panas, ketinggian, dan kelistrikan) di area pabrik masih dilakukan secara lisan di internal Departemen. Hal ini menyebabkan tidak adanya kontrol standarisasi APD, tidak adanya analisis bahaya (JSA) pra-kerja, serta tingginya risiko tumpang tindih pekerjaan antar-kontraktor yang dapat memicu kecelakaan fatal. Diperlukan implementasi sistem &#x27;Permit to Work&#x27; (PTW) untuk memastikan setiap pekerjaan berbahaya telah diverifikasi aman oleh tim HSE sebelum dimulai.","solution":"Release dan Implentasikan form Permit untuk pekerja atau vendor sebelum melakukan pekerjaan yang berisiko yang dapat menyebabkan bahaya kecelkaan kerja di area perusahaan.","situationAfter":"Pekerja atau vendor  melakukan pekerjaan yang berisiko dapat dimonotoring dan adanya pengawasan dari team hse dan security  setiap melakukan pekerjaan.<br>Pengunaan APD yang sesuai dengan pekerjaaanya","evalResults":"Setelah di lakukan evaluasi manfaat di perusahanPenurunan Angka Insiden (Near-Miss &amp; Accident): Terjadi penurunan signifikan pada kasus kecelakaan kerja karena setiap pekerjaan berisiko tinggi kini wajib melalui pemeriksaan keselamatan dan mitigasi bahaya terlebih dahulu.Peningkatan Kesadaran K3 (Safety Awareness): Pekerja tidak lagi langsung bekerja secara serampangan. Mereka menjadi lebih peduli terhadap penggunaan APD standar dan kondisi lingkungan sekitar sebelum memulai tugas.Koordinasi Area Lebih Rapi: Tidak ada lagi tabrakan atau tumpang tindih pekerjaan (conflict of activity) di lokasi yang sama karena tim HSE/Supervisor kini memiliki kontrol penuh terhadap siapa saja yang boleh bekerja di area tersebut.Akuntabilitas yang "WIN","dept":"Quality Management","jabatan":"Leader","jenis":null,"tanggal":"2026-06-27","bulan":6,"tglMulai":"2026-04-30","deadline":"2026-06-25","problem":"Data standar warna yang digunakan sebelumnya belum tersusun secara lengkap dan terintegrasi dalam satu sistem yang terpusat. Format penyimpanan data yang ada juga masih kurang mendukung proses penelusuran (traceability), sehingga menyulitkan pengguna dalam mencari dan mengakses standar warna yang dibutuhkan.Selain itu, format data sebelumnya belum fleksibel untuk dilakukan pembaruan (update) apabila terjadi perubahan standar warna akibat perubahan bahan baku, proses produksi, evaluasi R&amp;D, maupun permintaan customer. Riwayat perubahan standar warna juga belum terdokumentasi secara sistematis, sehingga menyulitkan proses monitoring, evaluasi, dan audit.Kondisi tersebut berpotensi menyebabkan penggunaan standar warna yang tidak terbaru serta menimbulkan ketidakkonsistenan dalam proses evaluasi warna produk antara bagian Produksi, Research &amp; Development (R&amp;D), dan Quality Management (QM). Oleh karena itu, diperlukan suatu sistem pengelolaan standar warna yang lebih terstruktur, mudah diperbarui, terdokumentasi, dan memiliki kemampuan penelusuran data yang lebih baik.","solution":"Untuk mengatasi permasalahan pada sistem standar warna sebelumnya, diusulkan pengembangan Program Standar Warna berbasis Google Sheet yang terintegrasi dan mudah diakses oleh seluruh pihak terkait.Metode improvement yang dilakukan adalah dengan membuat sistem database terpusat yang mampu menyimpan, memperbarui, dan menelusuri data standar warna secara lebih efektif. Program dikembangkan dengan beberapa fitur utama sebagai berikut:1. Membuat master data produk (MasterSFG) sebagai database induk untuk seluruh produk yang memiliki standar warna.2. Membuat database standar warna yang mencakup informasi:- Kode item- Nama produk- Kategori produk- Tipe standar warna (Min, Std, Max)- Nilai colorimetri (L, a, b)- BN Sample/WIP- Nomor revisi- Tanggal update- Approver R&amp;D dan QM- Keterangan perubahan3. Menambahkan sistem histori (History) untuk menyimpan seluruh riwayat perubahan standar warna sehingga setiap perubahan dapat ditelusuri dengan mudah.4. Menyusun format data yang lebih fleksibel sehingga perubahan standar warna dapat dilakukan tanpa menghilangkan data standar sebelumnya.5. Menerapkan sistem approval oleh R&amp;D dan QM untuk memastikan setiap standar warna yang digunakan telah diverifikasi dan disetujui.6. Menggunakan Google Sheet sebagai media penyimpanan sehingga data dapat diakses secara real-time, terpusat, dan memudahkan koordinasi antar departemen Produksi, R&amp;D, dan Quality Management (QM).Dengan implementasi program tersebut diharapkan pengelolaan standar warna menjadi lebih terstruktur, terdokumentasi, mudah ditelusur","situationAfter":"Setelah dilakukan pengembangan Program Standar Warna berbasis Google Sheet, seluruh data standar warna kini tersimpan dalam satu database terpusat yang terstruktur dan mudah diakses oleh seluruh departemen terkait.Program telah dilengkapi dengan informasi yang lebih lengkap, meliputi kode item, nama produk, kategori produk, tipe standar warna (Min/Std/Max), nomor revisi, tanggal pembaruan, BN sample, nilai colorimetri (L, a, b), tautan gambar hasil pengukuran, approver R&amp;D, approver QM, keterangan perubahan, serta PIC yang bertanggung jawab.Selain itu, sistem telah mendukung proses pembaruan standar warna secara fleksibel tanpa menghilangkan data historis yang telah ada. Setiap perubahan standar dapat terdokumentasi dengan baik melalui pencatatan revisi, tanggal update, dan keterangan perubahan sehingga meningkatkan kemampuan penelusuran data (traceability).Dengan adanya sistem ini, proses pencarian data standar warna menjadi lebih cepat, pengendalian dokumen lebih terjamin, serta meminimalkan risiko penggunaan standar warna yang tidak terbaru. Program juga meningkatkan koordinasi antara Produksi, Research &amp; Development (R&amp;D), dan Quality Management (QM) dalam menjaga konsistensi warna produk.","evalResults":"Berdasarkan hasil implementasi Program Standar Warna berbasis Google Sheet, sistem yang dikembangkan telah mampu meningkatkan efektivitas pengelolaan data standar warna produk.<br><br>Hasil evaluasi menunjukkan bahwa seluruh data standar warna kini tersimpan secara terpusat dalam satu database sehingga memudahkan proses pencarian, pembaruan, dan penelusuran data. Selain itu, sistem juga telah menyediakan histori perubahan, nomor revisi, dan informasi approval yang sebelumnya belum tersedia.<br><br>Program yang dikembangkan mampu meningkatkan traceability data karena setiap perubahan standar warna terdokumentasi dengan baik melalui pencatatan tanggal update, revisi, keterangan perubahan, serta pihak yang melakukan approval.<br><br>Dari sisi operasional, implementasi program memberikan manfaat sebagai berikut:<br><br>Proses pencarian data standar warna menjadi lebih cepat dan efisien.<br>Risiko penggunaan standar warna yang tidak terbaru dapat diminimalkan.<br>Setiap perubahan standar warna dapat ditelusuri dengan mudah melalui histori perubahan.<br>Koordinasi antara Produksi, Research &amp; Development (R&amp;D), dan Quality Management (QM) menjadi lebih efektif.<br>Konsistensi evaluasi warna produk antar departemen meningkat karena seluruh pihak menggunakan acuan standar yang sama.<br><br>Secara keseluruhan, implementasi Program Standar Warna dinilai berhasil dalam meningkatkan pengendalian standar warna produk, memperkuat sistem dokumentasi, serta mendukung proses quality assurance melalui sistem yang lebih terstruktur, terdokumentasi, dan mudah diakses.","beforeEvidence":["https://drive.google.com/open?id=1RhXJlvV2H3dvC7vogaWkuDWZMbFx8uQf"],"afterEvidence":["https://drive.google.com/open?id=1_A7n16lbIcGqwYUpHWR8ce4USuLnwCMw"],"docStatus":"COMPLETED","stage":"Screening 2","nilai":12.5,"totalScore":12.5,"reviewNote":"","insentif":50000.0,"paymentStatus":"COMPLETED","noRekening":nu g kemudahan penelusuran dokumen saat dibutuhkan.","beforeEvidence":["https://drive.google.com/open?id=1JwhLyuJR0fVxsT7v1AMjLKUac61KnpS5"],"afterEvidence":["https://drive.google.com/open?id=1qSXyHxuny8cqhiHmOwoI3OcbZR8rUr9p"],"docStatus":"COMPLETED","stage":"Tidak ada","nilai":12.0,"totalScore":12.0,"reviewNote":"","insentif":20000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"044/DGI/SS/26","nama":"Dewita Siska Syndia Putri","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-07-17","bulan":7,"tglMulai":"2026-06-12","deadline":"2026-06-22","problem":"Sebelumnya proses pengecekan ulang tanggal EXP di area packing masih belum didukung alat bantu visual berupa kalender tahun berjalan dan tahun berikutnya. Operator melakukan verifikasi tanggal EXP berdasarkan informasi dari QC, namun pada kondisi tertentu masih perlu memastikan kembali kesesuaian tanggal, bulan, dan tahun, terutama karena jumlah hari setiap bulan berbeda, seperti 28, 29, 30, atau 31 hari. Kondisi ini berpotensi menimbulkan kesalahan pembacaan atau penentuan tanggal EXP apabila tidak dilakukan pengecekan dengan lebih teliti.","solution":"Menyediakan kalender tahun berjalan dan tahun berikutnya di area packing/coding EXP sebagai alat bantu visual untuk verifikasi ulang tanggal EXP. Kalender digunakan oleh operator untuk memastikan tanggal, bulan, dan tahun EXP sudah sesuai dengan informasi yang diberikan QC sebelum proses coding dilakukan.","situationAfter":"Setelah improvement dilakukan:<br><br>1. Operator memiliki alat bantu visual untuk mengecek tanggal EXP.<br>2. Proses verifikasi tanggal EXP menjadi lebih jelas dan mudah.<br>3. Risiko kesalahan coding EXP dapat diminimalkan.<br>4. Potensi pekerjaan ulang akibat salah tanggal EXP dapat dikurangi.","evalResults":"Setelah kalender tersedia di area packing/coding EXP, operator lebih mudah melakukan pengecekan ulang terhadap tanggal EXP yang diberikan QC. Improvement ini membantu meningkatk
