TED","stage":"Tidak ada","nilai":8.5,"totalScore":8.5,"reviewNote":"","insentif":20000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"047/DGI/SS/26","nama":"Sopian Hermansyah","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-07-17","bulan":7,"tglMulai":"2026-06-12","deadline":"2026-06-20","problem":"Sebelum improvement dilakukan, timbangan di area produksi belum memiliki lokasi penyimpanan khusus yang jelas. Posisi timbangan sering berpindah-pindah ke area lain setelah digunakan, sehingga operator terkadang kesulitan mencari timbangan saat dibutuhkan.<br><br>Kondisi ini menyebabkan proses kerja menjadi kurang efisien karena operator membutuhkan waktu tambahan untuk mencari timbangan. Selain itu, dari sisi kerapihan area, penempatan timbangan menjadi kurang tertata. Timbangan juga berisiko terjatuh, tertabrak, atau tertumpuk barang lain karena tidak ditempatkan pada area khusus yang aman. Hal ini dapat berdampak pada umur pakai timbangan dan berpotensi mengganggu keakuratan alat timbang apabila terjadi kerusakan.","solution":"Membuat layout/area khusus untuk penempatan timbangan di setiap area produksi yang membutuhkan alat timbang. Area tersebut diberikan marking (yellow line), agar operator mengetahui lokasi penyimpanan yang benar.<br><br>Dengan adanya area khusus, timbangan dapat dikembalikan ke tempat yang sudah ditentukan setelah digunakan. Hal ini bertujuan untuk mempermudah pencarian, menjaga kerapihan area, serta mengurangi risiko timbangan rusak akibat sering dipindahkan atau diletakkan sembarangan.<br><br>Catatan penggunaan:<br>1. Timbangan wajib dikembalikan ke area yang telah ditentukan setelah digunakan.<br>2. Area timbangan tidak boleh digunakan untuk menyimpan barang lain.<br>3. Timbangan harus ditempatkan pada posisi yang aman, tidak mengganggu akses, dan tidak rawan tertabrak.<br>4. Jika ditemukan timbangan rusak atau tidak normal, segera laporkan ke leader/PIC terkait.","situationAfter":"Setelah improvement dilakukan:<br><br>1. Tersedia layout/area khusus untuk penempatan timbangan.<br>2. Operator lebih mudah menemukan timbangan saat akan digunakan.<br>3. Timbangan tidak lagi diletakkan sembarangan karena sudah memiliki lokasi tetap.<br>4. Area kerja menjadi lebih rapi dan tertata sesuai konsep 5R.<br>5. Risiko timbangan jatuh, tertabrak, tertumpuk, atau rusak dapat diminimalkan.<br>6. Penggunaan timbangan menjadi lebih nyaman dan lebih terkontrol.","evalResults":"Setelah dibuat layout/area khusus timbangan, operator lebih mudah mencari dan menggunakan timbangan karena lokasi penyimpanannya sudah jelas. Waktu yang sebelumnya digunakan untuk mencari timbangan dapat dikurangi, sehingga proses kerja menjadi lebih efisien.<br><br>Improvement ini juga membantu menjaga kerapihan area produksi, meningkatkan penerapan 5R, serta meminimalkan risiko kerusakan timbangan akibat penempatan yang tidak sesuai. Dengan adanya area khusus, kontrol terhadap penggunaan dan penyimpanan timbangan menjadi lebih baik.","beforeEvidence":["https://drive.google.com/open?id=1QEnDv3onsQRzc49_GWsCRzC8wY2i8JVG","https://drive.google.com/open?id=13hMCfPhTnv6TBXAYqS7QuYKQkoh5ad0q"],"afterEvidence":["https://drive.google.com/open?id=1_sNgTnNfaNckxUZY2wysWQ68GLgG3krZ","https://drive.google.com/open?id=1fFUNiHoJuRHGyeH-sKc4ocRmsjsftxy6"],"docStatus":"COMPLETED","stage":"Tidak ada","nilai":7.25,"totalScore":7.25,"reviewNote":"","insentif":20000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"048/DGI/SS/26","nama":"Wanda Raisa","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-07-17","bulan":7,"tglMulai":"2026-07-10","deadline":"2026-07-15","problem":"Sebelumnya reject packing material seperti jar reject dan dus reject belum memiliki area penyimpanan khusus yang jelas. Kondisi ini menyebabkan material reject disimpan di area yang kurang tertata, berpotensi menumpuk, serta berisiko tercampur dengan packing material yang masih bagus.<br><br>Selain itu, pendataan reject packing material belum dilakukan secara terstruktur setiap batch/shift, sehingga data aktual reject belum dapat diketahui dengan cepat dan rapi. Hal ini dapat menyulitkan proses monitoring jumlah reject, evaluasi penyebab reject, serta tindak lanjut terhadap material reject yang masih memiliki nilai ekonomis.","solution":"Menyediakan area/tempat khusus untuk mengumpulkan reject packing material seperti jar reject dan dus reject. Area tersebut diberi identitas/tagging yang jelas agar material reject tidak tercampur dengan packing material yang masih bagus.<br>Selain itu, dibuat form pendataan harian untuk mencatat reject packing material setiap batch dan shift, sehingga data aktual reject dapat diketahui dengan lebih cepat, rapi, dan mudah ditelusuri.<br>Material reject yang terkumpul dipisahkan berdasarkan jenisnya dan disimpan di lokasi yang telah ditentukan. Setelah mencapai jumlah tertentu, material tersebut dapat diserahkan kepada PIC terkait untuk proses disposisi lebih lanjut, seperti evaluasi, pemanfaatan kembali apabila masih diperbolehkan, atau penjualan ke pihak daur ulang sesuai prosedur perusahaan.<br><br>Catatan kontrol:<br>1. Reject packing material wajib dipisahkan dari packing material good.<br>2. Material reject tidak boleh digunakan kembali tanpa persetujuan pihak terkait.<br>3. Area reject harus diberi label yang jelas.<br>4. Data reject harian harus di-update oleh PIC yang ditentukan.","situationAfter":"Setelah improvement dilakukan:<br>1. Tersedia area khusus untuk penyimpanan reject packing material.<br>2. Jar reject dan dus reject tersimpan lebih rapi serta tidak tercampur dengan packing material yang masih bagus.<br>3. Material reject lebih mudah dikontrol, dihitung, dan ditelusuri.<br>4. Tersedia form pendataan harian reject packing material per batch/shift.<br>5. Data reject menjadi lebih mudah direkap sebagai bahan evaluasi bulanan.<br>6. Area kerja menjadi lebih tertata dan mendukung penerapan 5R.","evalResults":"Setelah area khusus dan form pendataan reject packing material diterapkan, pengelolaan reject menjadi lebih rapi, jelas, dan terkontrol. Reject packing material tidak lagi tercampur dengan packing material yang masih bagus, sehingga risiko mix up dapat diminimalkan.<br><br>Selain itu, data reject setiap batch/shift menjadi lebih mudah diketahui dan direkap. Data tersebut dapat digunakan sebagai bahan evaluasi bulanan, termasuk untuk melihat trend reject, melakukan follow up ke supplier apabila diperlukan, serta mengontrol material reject yang masih memiliki nilai ekonomis agar tidak terbuang begitu saja.<br><br><br><br>Improvement ini membantu meningkatkan kerapihan area, kontrol material, ketertiban pencatatan, serta mendukung penerapan 5R dan pengurangan waste di area produksi.","beforeEvidence":["https://drive.google.com/open?id=1ja60e8wKn3gzgIWqgTTCr207cZCmfdpE"],"afterEvidence":["https://drive.google.com/open?id=1XKhK4Md88VTkqF-TaIwx_Si3kR6K_Go1"],"docStatus":"COMPLETED","stage":"Tidak ada","nilai":9.0,"totalScore":9.0,"reviewNote":"","insentif":20000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"049/DGI/SS/26","nama":"Epa Hanipah","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-07-17","bulan":7,"tglMulai":"2026-07-13","deadline":"2026-07-15","problem":"sebelumnya area produksi belum memiliki papan informasi/mading khusus sebagai media komunikasi visual. Informasi seperti jadwal produksi, jadwal MPP mingguan, informasi safety, dan informasi operasional lainnya masih lebih banyak di sampaikan secara lisan atau melalui media digital. Kondisi ini berpotensi menyebabkan informasi tidak tersampaikan secara merata, kurang lengkap, atau berbeda pemahaman antar karyawan.","solution":"Menyediakan papan informasi/mading di area produksi sebagai media komunikasi visual yang berisi informasi penting seperti jadwal produksi, jadwal MPP mingguan, informasi safety, dan informasi n kembali sesuai persetujuan QA/QM untuk kebutuhan internal yang diperbolehkan.<br>2. Plastik 2 kali pakai atau kondisi sudah menurun: digunakan hanya untuk penampungan reject, bukan untuk produk OK.<br>3. Plastik sobek, kotor, berlubang, atau tidak layak: langsung dibuang sebagai limbah sesuai prosedur.<br><br>Sebelum proses coating Crufﬂe, Crunchy Waffle dipindahkan terlebih dahulu ke keranjang yang sesuai agar plastik bekas tidak langsung dibuang, tetapi dapat dipilah dan dikumpulkan pada tempat yang telah disediakan.<br>Catatan kontrol:<br>- Plastik yang digunakan kembali harus dalam kondisi bersih, utuh, tidak sobek, tidak berlubang, dan tidak terkontaminasi.<br>- Plastik reuse untuk produk/WIP hanya boleh dilakukan jika sudah disetujui QA/QM.<br>- Plastik yang sudah 2 kali pakai tidak digunakan untuk produk OK.<br>- Plastik harus diberi identitas/status agar tidak salah penggunaan.<br>- Jika ditemukan plastik rusak/kotor, wajib dipisahkan dan dibuang sebagai limbah.","situationAfter":"Setelah improvement dilakukan:<br>1. Plastik bekas Crunchy Waffle tidak langsung dibuang, tetapi dipilah berdasarkan kondisi dan jumlah pemakaian.<br>2. Plastik yang masih layak dapat dimanfaatkan kembali sesuai kategori dan persetujuan QA/QM.<br>3. Pemakaian plastik baru dapat dikurangi.<br>4. Risiko penggunaan plastik rusak/kotor dapat diminimalkan karena ada pemilahan dan kontrol status.<br>5. Area kerja menjadi lebih tertata karena tersedia tempat khusus untuk pengumpulan plastik bekas.","evalResults":"Setelah sistem pemilahan plastik bekas diterapkan, penggunaan plastik baru dapat dikurangi karena plastik yang masih layak dapat dimanfaatkan kembali sesuai kategori. Improvement ini membantu menurunkan limbah plastik, mendukung efisiensi biaya, serta meningkatkan kontrol penggunaan plastik bekas agar tidak digunakan sembarangan.<br><br>Dengan adanya pemilahan kondisi plastik dan aturan penggunaan yang jelas, risiko kontaminasi dari plastik rusak atau sobek dapat diminimalkan, terial.<br>2. Produk harus ditempatkan menggunakan wadah/rak yang sesuai dan stabil.<br>3. Penumpukan maksimal satu batch per susunan sesuai kapasitas yang ditentukan.<br>4. Produk tidak boleh ditempatkan di atas mesin atau area yang bukan peruntukannya.<br>5. PIC/leader memastikan area dan metode penumpukan digunakan sesuai standar.","situationAfter":"Setelah improvement dilakukan:<br>1. Tersedia area khusus dan berlabel untuk penyimpanan sementara WIP Crunchy Waffle.<br>2. Produk tidak lagi disimpan di atas mesin deck oven.<br>3. Aktivitas mesin dan jalur kerja tidak terganggu oleh penyimpanan produk.<br>4. Penumpukan menjadi maksimal satu batch sehingga tekanan dan risiko produk patah dapat diminimalkan.<br>5. Area penyimpanan menjadi lebih rapi, jelas, dan mudah dikontrol.","evalResults":"Setelah area khusus dan standar penumpukan diterapkan, WIP Crunchy Waffle memiliki lokasi penyimpanan sementara yang jelas dan tidak lagi ditempatkan di atas mesin deck oven. Penumpukan produk menjadi lebih terkendali sehingga potensi kerusakan akibat tekanan dan handling yang tidak sesuai dapat diminimalkan.<br><br>Improvement ini membantu menjaga kualitas WIP Crunchy Waffle, meningkatkan kerapihan area, dan memperjelas alur penyimpanan sebelum serah terima ke WIP.","beforeEvidence":["https://drive.google.com/open?id=1Ie35S2DMpdhR0LjqNoczcZZ0KQun7qlO","https://drive.google.com/open?id=16CwGFTnyTlzwjfBCs7U-CgUPdC3mGX3H"],"afterEvidence":["https://drive.google.com/open?id=14cimcuxxHxjkQcQQcQAtKiKhttNGtUyc","https://drive.google.com/open?id=1OdCDUV0Fb21ynKLwHW8bCcZyCAtQIlpP"],"docStatus":"COMPLETED","stage":"Tidak ada","nilai":null,"totalScore":0,"reviewNote":"","insentif":20000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"053/DGI/SS/26","nama":"Resnu Kukuh Wicaksono","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-07-18","bulan":7,"tglMulai":"2026-07-10","deadline":"2026-07-16","problem":"Sebelumnya area cuci lantai 1 sering terlihat kotor setelah digunakan untuk mencuci peralatan atau mengambil air panas. Lantai area cuci dan akses menuju wastafel sering terdapat bekas jejak sepatu, sisa WIP, dan kondisi lantai menjadi basah/licin. Kondisi ini dapat berdampak pada kebersihan area, kerapihan, serta potensi risiko terpeleset bagi operator.<br><br>Selain itu, belum tersedia area penempatan sepatu yang jelas sebelum memasuki area cuci, sehingga kontrol kebersihan akses menuju area cuci belum optimal.","solution":"Menyediakan rak/tempat khusus untuk penempatan sepatu di bagian luar area cuci lantai 1 serta memberikan batas/marking area yang jelas. Dengan adanya rak dan batas area, operator memiliki tempat yang jelas untuk menempatkan sepatu sesuai ketentuan sebelum memasuki area cuci, sehingga kebersihan lantai dan akses area cuci lebih mudah dikontrol.<br><br>Catatan kontrol:<br>- Penempatan rak sepatu tidak boleh mengganggu akses/jalur kerja.<br>- Area harus diberi marking/batas yang jelas.<br>- Jika masuk ke area basah, operator tetap harus menggunakan alas kaki yang sesuai dan aman berdasarkan ketentuan QA/HSE.<br>- Area cuci tetap wajib dibersihkan setelah digunakan.<br>- Tidak boleh ada sepatu yang diletakkan sembarangan di area cuci atau akses kerja.","situationAfter":"Setelah improvement dilakukan:<br>1. Tersedia rak/tempat khusus untuk penempatan sepatu di area cuci lantai 1.<br>2. Area masuk menuju ruang cuci memiliki batas/marking yang lebih jelas.<br>3. Sepatu tidak lagi diletakkan sembarangan di sekitar area cuci.<br>4. Kebersihan lantai area cuci lebih mudah dijaga dan dikontrol.<br>5. Risiko lantai kotor, basah/licin, dan tidak rapi dapat diminimalkan.","evalResults":"Setelah tersedia rak sepatu dan batas area di area cuci lantai 1, operator memiliki lokasi penempatan sepatu yang lebih jelas dan tertata. Improvement ini membantu menjaga kebersihan area cuci, mengurangi bekas jejak sepatu pada lantai, serta mendukung penerapan 5R, GMP, dan safety di area produksi.<br><br>Dengan adanya visual control dan aturan penempatan yang jelas, area cuci menjadi lebih rapi, lebih mudah dikontrol, dan risiko lantai kotor atau licin dapat diminimalkan.","beforeEvidence":["https://drive.google.com/open?id=1siyfX0Y7vQdWY565ObMF7IiKm4xYvN7p","https://drive.google.com/open?id=1ROvo0MnqXp-Gy1hquapKBCLxltEFmK_c","https://drive.google.com/open?id=1c5PGKRWv9vFl-Jxd7aIisoI9TTEtmsP1"],"afterEvidence":["https://drive.google.com/open?id=1fhu3B1mZphxDQdowxYAHIbzLufIyFjxA","https://drive.google.com/open?id=1nhU8FYgzbs5kqao1XTvWc874C-rth2EF","https://drive.google.com/open?id=19IZSqQ3K7OGocoRho8I_oOMijIITri4S"],"docStatus":"COMPLETED","stage":"Tidak ada","nilai":null,"totalScore":0,"reviewNote":"","insentif":20000.0,"paymentStatus":"COMPLETED","noRekening":null,"buktiFile":null},{"id":"054/DGI/SS/26","nama":"Desi Ariska","businessUnit":"DGI","dept":"Production","jabatan":"Operator","jenis":null,"tanggal":"2026-07-18","bulan":7,"tglMulai":"2026-07-10","deadline":"2026-07-16","problem":"Sebelumnya belum tersedia tempat khusus untuk memisahkan stiker semicot berdasarkan status verifikasi Quality Control. Stiker yang belum dicek, sudah dicek, dan berstatus hold berpotensi ditempatkan pada area yang sama tanpa identitas status yang jelas.<br><br>Kondisi ini dapat menyebabkan operator kesulitan mengetahui status stiker yang boleh digunakan serta meningkatkan risiko mix up atau penggunaan stiker yang belum diverifikasi. Kesalahan tersebut dapat berdampak pada ketidaksesuaian nama varian, nomor BPOM, EXP, maupun batch number pada produk.","solution":"Menyediakan tempat khusus untuk segregasi stiker semicot berdasarkan tiga status:<br>1. Belum Dicek Quality Control<br>2. Sudah Dicek / Release Quality Control<br>3. Hold Quality Control<br>Setiap tempat diberikan label yang jelas agar operator dan QC dapat mengenali status stiker dengan cepat. Stiker hanya boleh dipindahkan dari area “Belum Dicek” ke area “Sudah Dicek/Release” oleh QC setelah proses verifikasi /* Hapus karyawan (mis. resign): semua data atas nama orang tsb dibuang,
   lalu statistik Home, Waiting List, Incentives, Investasi/Saving & Analysis dihitung ulang. */
function removePerson(id){
  const target=scoringList.find(x=>x.id===id);
  if(!target) return;
  const key=String(target.nama).trim().toLowerCase();
  const same=r=>String(r.nama||'').trim().toLowerCase()===key;
  const nScoring=scoringList.filter(same).length;
  const nWaiting=waitingList.filter(same).length;
  const msg='Hapus "'+target.nama+'" dari sistem?\n\n'
    +'• '+nScoring+' data Scoring\n'
    +(nWaiting?'• '+nWaiting+' data Waiting List\n':'')
    +'\nSemua rekap (Home, Incentives, Investasi, Saving, Analysis) ikut ter-update. Tindakan ini tidak bisa dibatalkan.';
  if(!confirm(msg)) return;
  const prune=arr=>{ for(let i=arr.length-1;i>=0;i--){ if(same(arr[i])) arr.splice(i,1); } };
  const removedIds=[...scoringList,...waitingList].filter(same).map(r=>r.id);
  prune(scoringList); prune(waitingList); prune(investasiList); prune(savingList);
  removedIds.forEach(i=>{ if(typeof notifRead!=='undefined') notifRead.delete(i); });
  refreshStats();
  renderPage();
}

/* ======================= DOWNLOAD EXCEL ======================= */
function downloadExcel(page){
  const rows = page==='waiting' ? waitingList : filteredData(page);
  let headers, data, sheetName, fileName, moneyCols=[], pctCols=[];
  if(page==='waiting'){
    headers=['Improvement ID','Nama','Business Unit','Departemen','Jabatan','Jenis Improvement','Tanggal Submit','Status'];
    data=rows.map(r=>[r.id,r.nama,r.businessUnit,r.dept,r.jabatan,na(r.jenis),fmtDate(r.tanggal),r.status]);
    sheetName='Waiting List'; fileName='WaitingList_WinCo_2026';
  } else if(page==='investasi'){
    headers=['Improvement ID','Nama','Business Unit','Departemen','Idea','Date','Product','Harga Alat','Saving/Month','Saving/Year'];
    data=rows.map(r=>[r.id,r.nama,r.businessUnit,r.dept,r.idea,fmtDate(r.tanggal),r.product,r.harga,r.savingMonth,r.savingYear]);
    if(rows.length){
      data.push(['Total Investasi','','','','','','',sumBy(rows,'harga'),sumBy(rows,'savingMonth'),sumBy(rows,'savingYear')]);
    }
    moneyCols=[7,8,9];
    sheetName='Investasi'; fileName='Investasi_WinCo_2026';
  } else {
    headers=['Improvement ID','Nama','Business Unit','Departemen','Idea','Date','Saving Month','Saving Year'];
    data=rows.map(r=>[r.id,r.nama,r.businessUnit,r.dept,r.idea,fmtDate(r.tanggal),r.savingMonth,r.savingYear]);
    moneyCols=[6,7];
    sheetName='Saving'; fileName='Saving_WinCo_2026';
  }
  if(window.XLSX){
    const ws=XLSX.utils.aoa_to_sheet([headers,...data]);
    ws['!cols']=headers.map((h,c)=>({wch:Math.max(h.length,...data.map(r=>String(r[c]).length))+3}));
    data.forEach((r,ri)=>{
      moneyCols.forEach(c=>{ const cell=ws[XLSX.utils.encode_cell({r:ri+1,c})]; if(cell) cell.z='#,##0'; });
      pctCols.forEach(c=>{ const cell=ws[XLSX.utils.encode_cell({r:ri+1,c})]; if(cell) cell.z='0.0%'; });
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
    XLSX.writeFile(wb,fileName+'.xlsx');
  } else {
    /* fallback bila library Excel tidak termuat (offline): CSV yang bisa dibuka di Excel */
    const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const csv='\uFEFF'+[headers,...data].map(r=>r.map(esc).join(';')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=fileName+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

function renderAnalysisPage(){
  refreshStats();
  const catTotals=qcdsmpeCategories.map(c=>deptCategoryMatrix.reduce((a,d)=>a+d.vals[c],0));
  const grandTotal=catTotals.reduce((a,b)=>a+b,0);
  if(grandTotal===0) return `<div class="page-head"><h1>Analysis</h1></div><div class="card" style="padding:24px;"><div class="empty-state"><span class="ic">📭</span><p>Tidak ada data kategori (QCDSMPE). Kolom Jenis Improvement pada data belum berisi kategori.</p></div></div>`;
  const maxCat=Math.max(...catTotals);
  const maxCell=Math.max(...deptCategoryMatrix.flatMap(d=>qcdsmpeCategories.map(c=>d.vals[c])));

  const barsHTML=qcdsmpeCategories.map((c,i)=>{
    const val=catTotals[i]; const pct=(val/grandTotal*100).toFixed(1);
    return `<div class="compare-bar-row">
      <div class="lbl"><span>${c}</span><span>${val} (${pct}%)</span></div>
      <div class="compare-bar-track"><div class="compare-bar-fill investasi" style="width:${(val/maxCat*100)}%;"></div></div>
    </div>`;
  }).join('');

  const heatRows=deptCategoryMatrix.map(d=>{
    const cells=qcdsmpeCategories.map(c=>{
      const v=d.vals[c];
      const intensity= maxCell>0 ? (v/maxCell) : 0;
      const bg=`rgba(96,92,168,${(0.08+intensity*0.72).toFixed(2)})`;
      const textColor= intensity>0.55 ? '#fff':'var(--dark)';
      return `<td style="background:${bg};color:${textColor};font-weight:700;text-align:center;">${v}</td>`;
    }).join('');
    return `<tr><td style="font-weight:700;text-align:center;">${d.dept}</td>${cells}</tr>`;
  }).join('');

  let topDept=deptCategoryMatrix[0], topDeptTotal=-1;
  deptCategoryMatrix.forEach(d=>{ const t=qcdsmpeCategories.reduce((a,c)=>a+d.vals[c],0); if(t>topDeptTotal){topDeptTotal=t; topDept=d;} });
  let topCat=qcdsmpeCategories[0], topCatVal=-1;
  qcdsmpeCategories.forEach(c=>{ if(topDept.vals[c]>topCatVal){topCatVal=topDept.vals[c]; topCat=c;} });

  return `
    <div class="page-head"><h1>Analysis</h1></div>
    <div style="margin-bottom:20px;">
      <div class="card" style="padding:24px;">
        <div class="section-title">Rangkuman QCDSMPE (${grandTotal} data)</div>
        ${barsHTML}
      </div>
    </div>
    <div class="card" style="padding:24px;">
      <div class="section-title">Peta Sebaran Departemen × Kategori (QCDSMPE)</div>
      <div class="tbl-wrap">
        <table class="heat-table">
          <thead><tr><th style="text-align:center;">Departemen</th>${qcdsmpeCategories.map(c=>`<th style="text-align:center;">${c}</th>`).join('')}</tr></thead>
          <tbody>${heatRows}</tbody>
        </table>
      </div>
    </div>`;
}

/* ======================= MODAL / DETAIL VIEW ======================= */
let modalCtx={ id:null, isScoring:false, mode:'simple' };

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

function viewWaitingDetail(id){ modalCtx={id, isScoring:false, mode:'simple'}; renderModalContent(); document.getElementById('overlay').classList.add('show'); }

function switchModalView(mode){ modalCtx.mode=mode; renderModalContent(); }

function findItem(id, isScoring){
  return isScoring ? scoringList.find(x=>x.id===id) : waitingList.find(x=>x.id===id);
}

function buildReviewFormHTML(item){
  const rowHTML=(section, idx, row)=>{
    const arr = section==='main'? item.skorMain : item.skorExtra;
    const vals = arr[idx];
    const skorCells = vals.map((v,ci)=>`<td><input type="number" min="1" max="5" class="skor-input" data-section="${section}" data-row="${idx}" data-col="${ci}" value="${v!==null?v:''}" oninput="recalcRubric()"></td>`).join('');
    return `<tr>
      <td>${row.no}</td>
      <td class="kriteria-cell">${row.kriteria}</td>
      <td class="desk-cell">${row.deskripsi}</td>
      <td>${row.bobot}%</td>
      ${skorCells}
      <td class="total-skor-cell" data-section="${section}" data-row="${idx}">0.00</td>
    </tr>`;
  };
  const mainRows = scoringCriteriaMain.map((r,i)=>rowHTML('main',i,r)).join('');
  const extraRows = scoringCriteriaExtra.map((r,i)=>rowHTML('extra',i,r)).join('');
  return `
    <div class="field">
      <label>Tahap</label>
      <select id="reviewStage">${stageOptions.map(s=>`<option value="${s}" ${item.stage===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>

    <div class="section-title" style="margin-top:6px;">Bobot Penilaian</div>
    <table class="legend-table">
      <tr><td>Skor</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
      <tr><td>Kriteria</td><td>Sangat Kurang</td><td>Kurang</td><td>Cukup</td><td>Baik</td><td>Sangat Baik</td></tr>
    </table>

    <div class="section-title" style="margin-top:18px;">B. Aspek Penilaian Utama</div>
    <div class="tbl-wrap"><table class="rubric-table">
      <thead><tr><th>No</th><th>Kriteria</th><th>Deskripsi</th><th>Bobot</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>Total Skor</th></tr></thead>
      <tbody>${mainRows}</tbody>
    </table></div>

    <div class="section-title" style="margin-top:18px;">C. Aspek Penilaian Tambahan</div>
    <div class="tbl-wrap"><table class="rubric-table">
      <thead><tr><th>No</th><th>Kriteria</th><th>Deskripsi</th><th>Bobot</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>Total Skor</th></tr></thead>
      <tbody>${extraRows}</tbody>
    </table></div>

    <div class="total-score-strip"><span>Total Score (maks. 25)</span><span id="totalScoreVal">${(item.totalScore||0).toFixed(2)}</span></div>

    <div class="field" style="margin-top:18px;">
      <label>Catatan Review</label>
      <textarea id="reviewNote" placeholder="Tulis catatan/hasil review...">${item.reviewNote||''}</textarea>
    </div>`;
}

function recalcRubric(){
  let overallSum=0, anyInput=false;
  [['main',scoringCriteriaMain],['extra',scoringCriteriaExtra]].forEach(([section,rows])=>{
    rows.forEach((r,idx)=>{
      const inputs=document.querySelectorAll(`.skor-input[data-section="${section}"][data-row="${idx}"]`);
      let sum=0;
      inputs.forEach(inp=>{ const v=parseFloat(inp.value); if(!isNaN(v)){ sum+=v; anyInput=true; } });
      const avg=sum/4;
      const totalSkor=(r.bobot/100)*avg;
      overallSum+=totalSkor;
      const cell=document.querySelector(`.total-skor-cell[data-section="${section}"][data-row="${idx}"]`);
      if(cell) cell.textContent=totalSkor.toFixed(2);
    });
  });
  const el=document.getElementById('totalScoreVal');
  if(el && anyInput) el.textContent=(overallSum*5).toFixed(2);
}

function computeTotalScore(item){
  let sum=0;
  scoringCriteriaMain.forEach((r,idx)=>{ const vals=item.skorMain[idx]; const avg=vals.reduce((a,v)=>a+(v||0),0)/4; sum+=(r.bobot/100)*avg; });
  scoringCriteriaExtra.forEach((r,idx)=>{ const vals=item.skorExtra[idx]; const avg=vals.reduce((a,v)=>a+(v||0),0)/4; sum+=(r.bobot/100)*avg; });
  return sum*5;
}

function renderModalContent(){
  const item=findItem(modalCtx.id, modalCtx.isScoring);
  if(!item) return;
  document.getElementById('modal').className = modalCtx.isScoring ? 'modal wide' : 'modal';
  const infoHTML = modalCtx.mode==='simple' ? buildSimpleViewHTML(item, modalCtx.isScoring) : buildDocumentViewHTML(item);
  const reviewFormHTML = modalCtx.isScoring ? buildReviewFormHTML(item) : '';
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>${modalCtx.isScoring?'Review &amp; Scoring':'Detail Submission'}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="view-tabs">
        <button class="view-tab ${modalCtx.mode==='simple'?'active':''}" onclick="switchModalView('simple')">Ringkas</button>
        <button class="view-tab ${modalCtx.mode==='document'?'active':''}" onclick="switchModalView('document')">Dokumen</button>
      </div>
      ${infoHTML}
      ${reviewFormHTML}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${modalCtx.isScoring?'Batal':'Tutup'}</button>
      ${modalCtx.isScoring?`<button class="btn btn-primary" onclick="saveScoring('${item.id}')">💾 Simpan</button>`:''}
    </div>`;
  if(modalCtx.isScoring) setTimeout(recalcRubric,0);
}

function saveScoring(id){
  const s=scoringList.find(x=>x.id===id);
  if(!s) return;
  s.stage=document.getElementById('reviewStage').value;
  [['main',scoringCriteriaMain,s.skorMain],['extra',scoringCriteriaExtra,s.skorExtra]].forEach(([section,rows,arr])=>{
    rows.forEach((r,idx)=>{
      const inputs=document.querySelectorAll(`.skor-input[data-section="${section}"][data-row="${idx}"]`);
      inputs.forEach((inp,ci)=>{ const v=parseFloat(inp.value); arr[idx][ci]= isNaN(v)?null:v; });
    });
  });
  const anyScore=[...s.skorMain,...s.skorExtra].some(r=>r.some(v=>v!==null));
  if(anyScore){ s.totalScore=computeTotalScore(s); s.nilai=Math.round(s.totalScore*100)/100; }
  s.reviewNote=document.getElementById('reviewNote').value;
  closeModal();
  renderPage();
}

function renderSalaryPage(){
  const rows=scoringList.map((s,i)=>{
    const payClass = payClassOf(s.paymentStatus);
    const payLabel = payLabelOf(s.paymentStatus);
    return `<tr>
      <td>${i+1}</td>
      <td class="name-cell">${s.nama}</td>
      <td><span class="tag">${s.businessUnit}</span></td>
      <td>${s.id}</td>
      <td>${na(s.noRekening)}</td>
      <td>${s.insentif?fmtRupiah(s.insentif):'<span style="color:var(--cocoa);">Tidak ada</span>'}</td>
      <td><span class="pay-dot ${payClass}"><span class="d"></span>${payLabel}</span></td>
      <td>${s.buktiFile?('📎 '+s.buktiFile):'<span style="color:var(--cocoa);">Tidak ada</span>'}</td>
      <td><button class="view-btn" onclick="openSalaryEdit('${s.id}')">✏️ Update</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="page-head"><div><h1>Incentives</h1><div class="sub">${scoringList.length} data · Sudah dibayar: ${fmtRupiah(scoringList.filter(x=>x.paymentStatus==='COMPLETED').reduce((a,x)=>a+(x.insentif||0),0))}</div></div></div>
    <div class="card tbl-wrap">
      <table class="tbl-center">
        <thead><tr><th>No</th><th>Nama Karyawan</th><th>Business Unit</th><th>Improvement ID</th><th>Nomor Rekening</th><th>Insentif</th><th>Status Pembayaran</th><th>Bukti Transfer</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function openSalaryEdit(id){
  const s=scoringList.find(x=>x.id===id);
  if(!s) return;
  document.getElementById('modal').className='modal';
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>Update Pembayaran</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <table class="kv-table">
        <tr><td>Nama Karyawan</td><td>${s.nama}</td></tr>
        <tr><td>Business Unit</td><td>${s.businessUnit}</td></tr>
        <tr><td>Improvement ID</td><td>${s.id}</td></tr>
        <tr><td>Insentif</td><td>${s.insentif?fmtRupiah(s.insentif):'Tidak ada'}</td></tr>
      </table>
      <div class="field"><label>Nomor Rekening</label><input type="text" id="salaryRek" value="${s.noRekening||''}" placeholder="Tidak ada"></div>
      <div class="field"><label>Status Pembayaran</label><select id="salaryStatus">${payOptions.map(p=>`<option value="${p[0]}" ${s.paymentStatus===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
      <div class="field">
        <label>Bukti Transfer</label>
        <div class="upload-field">
          <input type="file" id="salaryBukti" accept="image/*,.pdf" onchange="handleSalaryFile(this)">
          <div class="upload-filename" id="salaryFileName">${s.buktiFile?('📎 '+s.buktiFile):''}</div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveSalary('${s.id}')">💾 Simpan</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}
function handleSalaryFile(input){
  const f=input.files[0];
  document.getElementById('salaryFileName').textContent = f ? '📎 '+f.name : '';
}
function saveSalary(id){
  const s=scoringList.find(x=>x.id===id);
  if(!s) return;
  s.noRekening=document.getElementById('salaryRek').value.trim()||null;
  s.paymentStatus=document.getElementById('salaryStatus').value;
  const fi=document.getElementById('salaryBukti');
  if(fi && fi.files[0]) s.buktiFile=fi.files[0].name;
  closeModal();
  renderPage();
}
</script>
